<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>promo tile</title>
<style>
  html,body{ margin:0; width:440px; height:280px; overflow:hidden;
    font-family:system-ui,Segoe UI,sans-serif; }
  .tile{ width:440px; height:280px; position:relative; color:#e9e3d6;
    background:
      radial-gradient(120% 90% at 85% -10%, #1a2330 0%, transparent 55%),
      radial-gradient(90% 60% at 0% 110%, #181f1a 0%, transparent 45%),
      #0d1014;
    display:flex; flex-direction:column; justify-content:center; padding:0 34px; box-sizing:border-box; }
  .nums{ position:absolute; inset:0; font:600 13px ui-monospace,monospace; color:#1c2634; letter-spacing:.06em;
    line-height:2.1; padding:14px 18px; user-select:none; overflow:hidden; }
  .brand{ display:flex; align-items:center; gap:14px; position:relative; z-index:1; }
  .seal{ width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:#1a1206;
    background:linear-gradient(160deg,#f0b765,#e3a552); box-shadow:0 8px 22px -6px rgba(227,165,82,.55); }
  .seal svg{ width:28px;height:28px }
  .wm{ font:700 34px/1 system-ui; letter-spacing:-.01em } .wm b{ color:#e3a552 }
  .tag{ position:relative; z-index:1; margin-top:16px; font-size:14.5px; color:#99a3b1; max-width:330px; line-height:1.45 }
  .pill{ position:relative; z-index:1; margin-top:16px; display:inline-flex; align-items:center; gap:7px; align-self:flex-start;
    font:600 11px ui-monospace; letter-spacing:.08em; text-transform:uppercase; color:#57c08a;
    border:1px solid #234634; background:#16301f; padding:5px 11px; border-radius:999px }
</style></head>
<body>
  <div class="tile">
    <div class="nums">312,899&nbsp;&nbsp;10,000&nbsp;&nbsp;2,974&nbsp;&nbsp;T1&nbsp;14%&nbsp;&nbsp;45,230<br>128&nbsp;chunks&nbsp;&nbsp;ضريبة&nbsp;القيمة&nbsp;المضافة&nbsp;&nbsp;EGP<br>2025-12-31&nbsp;&nbsp;Valid&nbsp;&nbsp;884&nbsp;&nbsp;/details&nbsp;&nbsp;xlsx<br>Received&nbsp;&nbsp;Submitted&nbsp;&nbsp;RAYA&nbsp;&nbsp;69,343&nbsp;&nbsp;T4</div>
    <div class="brand">
      <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l8 4v5c0 4.5-3.2 7.5-8 9-4.8-1.5-8-4.5-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="wm">ETA&nbsp;<b>Bulk</b></div>
    </div>
    <div class="tag">Bulk-export your Egyptian Tax Authority e-invoices &amp; e-receipts to Excel — past the portal's search limits.</div>
    <div class="pill"><span>●</span> On-device · your own data</div>
  </div>
</body></html>
