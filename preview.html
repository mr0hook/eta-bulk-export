<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETA Bulk — drawer preview</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #f4f6f9, #e9edf2); }
  .fake { padding: 40px; color: #64748b; }
  .fake h1 { font-size: 20px; margin: 0 0 20px; color: #334155; }
  .fake .row { height: 34px; margin: 14px 0; border-radius: 8px; background: #cbd5e1; opacity: .5; }
  .fake .row:nth-child(2){ width: 45% } .fake .row:nth-child(3){ width: 80% } .fake .row:nth-child(4){ width: 66% }
  .note { position: fixed; left: 16px; bottom: 16px; font: 12px ui-monospace, monospace; color: #64748b; }
</style>
</head>
<body>
  <div class="fake">
    <h1>Portal backdrop (preview) — the drawer is injected on top</h1>
    <div class="row"></div><div class="row"></div><div class="row"></div>
  </div>
  <div class="note">preview: token shows "not found" (no portal session) — that's expected here.</div>
  <!-- our own MIT ExcelJS, then the built bundle (auto-mounts the drawer) -->
  <script src="vendor/exceljs.min.js"></script>
  <script src="dist/etaBulk.js"></script>
  <script>
    // auto-open the drawer for the preview
    window.addEventListener('load', () => setTimeout(() => {
      const h = document.getElementById('eta-bulk-host');
      h && h.shadowRoot.getElementById && h.shadowRoot.querySelector('#pill').click();
    }, 250));
  </script>
</body>
</html>
