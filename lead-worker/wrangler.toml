name = "eta-bulk-leads"
main = "worker.js"
# Keep this recent — Cloudflare's Workers best-practices guide (Feb 2026) recommends setting it to
# ~today's date so you get current runtime behavior. nodejs_compat is inert here (we use only web APIs)
# but is the documented default and future-proofs the Worker.
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]

# KV namespace "ETA_BULK_LEADS" — already created in your account (id below), bound as LEADS.
# NOTE (TOML): every bare key must appear BEFORE the first [table] header of its section, or it
# silently becomes a key of that table instead. `wrangler deploy --dry-run` prints the resolved
# binding list — check LEADS is in it after editing this file.
kv_namespaces = [
  { binding = "LEADS", id = "7d039a655c434302a5e8fcae6a5450d0" }
]

# D1 "eta-bulk-jobs-prod" — job records (SPEC-016 / A2, per ADR-002), bound as JOBS.
#
# This MUST stay identical to [env.production] below, because both publish to the SAME worker name
# ("eta-bulk-leads"). 2026-09-20: a bare `wrangler deploy` — the default target, which at the time
# declared no D1 — replaced the live worker with a copy that had no JOBS binding. /api/dashboard
# answered "portal unavailable — no D1 binding" and /plan/* answered 503 "planner unavailable": the
# tool looked dead to every user, from a deploy that printed no warning at all. Environments do not
# inherit bindings in wrangler, so the only defence is that the two lists agree.
[[d1_databases]]
binding = "JOBS"
database_name = "eta-bulk-jobs-prod"
database_id = "e8e138c0-1bd2-463b-902c-dcb9c98354f4"

# A0: the dashboard and privacy pages live in src/assets/*.html and are imported as text modules
# (`import DASH from '../assets/dash.html'`). Deliberately NOT Workers Static Assets: those are served
# by the platform ahead of the Worker, which would change who answers `/` and `/admin`. A text module
# keeps the exact same request path as when the HTML was a template literal inside worker.js.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Durable Object "Locks" — strongly-consistent, single-threaded coordination for ATOMIC RIN-ownership claims
# and rate limiting (Cloudflare KV has no compare-and-set). Available on the Workers Free plan. The migration
# below creates the SQLite-backed class on first `wrangler deploy`. The Worker code falls back to KV if the
# binding is ever absent, so it still runs without this.
[[durable_objects.bindings]]
name = "LOCKS"
class_name = "Locks"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Locks"]

# Daily analytics snapshot at 02:00 UTC (~04-05:00 Cairo, off-peak) — scheduled() writes one snap:<date>
# KV record per day (120-day TTL) feeding the dashboard's Trend chart. Free plan supports cron triggers.
[triggers]
crons = ["0 2 * * *"]

# Workers Logs: ingest + index logs for 7 days so you can debug register/session/admin traffic and 4xx/5xx.
[observability]
enabled = true

  [observability.logs]
  invocation_logs = true

# ADMIN_TOKEN guards /admin, /api/*, and /export (via the Authorization: Bearer header). Set it once with:
#   wrangler secret put ADMIN_TOKEN
# Per environment:
#   wrangler secret put ADMIN_TOKEN --env staging
#   wrangler secret put ADMIN_TOKEN --env production

# ── environments ─────────────────────────────────────────────────────────────────────────────────
# The top-level config above stays the DEFAULT target, so a bare `wrangler deploy --env=""` hits the
# live worker exactly as before.
#
# Environments do NOT inherit bindings in wrangler: kv_namespaces, rules, durable_objects, migrations
# and triggers must be repeated under each [env.*]. That is why the blocks below look duplicated.
#
# Staging got its own KV namespace on 2026-08-09. It shares nothing with production: different
# worker name, different namespace id, different secret. Secrets do NOT carry across environments —
# set staging's separately, or every /api/* call there returns 401:
#     npx wrangler secret put ADMIN_TOKEN --env staging
#
# Note `--dry-run` never validates a namespace id: it bundles without contacting the account, so a
# wrong id passes the dry run and fails only on a real deploy (Cloudflare API error 10042).

[env.staging]
name = "eta-bulk-leads-staging"
kv_namespaces = [
  { binding = "LEADS", id = "3b62222ea7234685bf5d569af322454b" }
]

  [[env.staging.rules]]
  type = "Text"
  globs = ["**/*.html"]
  fallthrough = true

  [[env.staging.durable_objects.bindings]]
  name = "LOCKS"
  class_name = "Locks"

  [[env.staging.migrations]]
  tag = "v1"
  new_sqlite_classes = ["Locks"]

  # D1 for job records (SPEC-016 / A2, per ADR-002). Bound as JOBS to match the LEADS convention —
  # wrangler's auto-derived binding name (eta_bulk_jobs) is the database name, not a good identifier.
  # Schema: npx wrangler d1 execute eta-bulk-jobs --file=schema.sql --remote --env staging
  #
  # Production has its OWN database (eta-bulk-jobs-prod, wired below) for the same reason it has its
  # own KV namespace: one shared database would put live job records and staging test runs in the
  # same tables. The planner routes still treat a missing env.JOBS as "unavailable" rather than
  # throwing, the same way every LOCKS caller falls back — a deploy to an environment without the
  # binding should degrade, not 500.
  [[env.staging.d1_databases]]
  binding = "JOBS"
  database_name = "eta-bulk-jobs"
  database_id = "aecaceea-e253-4a85-8ceb-0b77bef35dfa"

  # No cron on staging: the daily snapshot would write snap: records nobody reads. This MUST be an
  # explicit empty list — omitting the block does not mean "no triggers", it inherits the top-level
  # schedule, and the first staging deploy duly reported `schedule: 0 2 * * *`. Test scheduled()
  # with `wrangler dev --test-scheduled` instead.
  [env.staging.triggers]
  crons = []

  [env.staging.observability]
  enabled = true

[env.production]
name = "eta-bulk-leads"
kv_namespaces = [
  { binding = "LEADS", id = "7d039a655c434302a5e8fcae6a5450d0" }
]

  [[env.production.rules]]
  type = "Text"
  globs = ["**/*.html"]
  fallthrough = true

  [[env.production.durable_objects.bindings]]
  name = "LOCKS"
  class_name = "Locks"

  [[env.production.migrations]]
  tag = "v1"
  new_sqlite_classes = ["Locks"]

  # Separate database from staging — same schema, different data.
  # Schema: npx wrangler d1 execute eta-bulk-jobs-prod --file=schema.sql --remote --env production
  [[env.production.d1_databases]]
  binding = "JOBS"
  database_name = "eta-bulk-jobs-prod"
  database_id = "e8e138c0-1bd2-463b-902c-dcb9c98354f4"

  [env.production.triggers]
  crons = ["0 2 * * *"]

  [env.production.observability]
  enabled = true

    [env.production.observability.logs]
    invocation_logs = true
