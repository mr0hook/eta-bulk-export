<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ETA Bulk — Admin console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">

<style>
/* ═══ ETA Bulk — admin console ═══════════════════════════════════════════════
   Design language: omarsoliman.dev "clay & paper" — warm editorial-technical.
   Paper grounds, ink browns, a clay accent for "you can act on this", and gold
   reserved for ONE job: in-flight. Structure comes from hairline warm borders
   and uppercase mono micro-labels, not from boxes and fills.
   Self-contained by requirement: served as a wrangler Text module under a strict
   CSP. No CDN, no remote fonts, no remote images. System stacks only — the same
   compromise the extension drawer makes, so the two read as one product.
   ─────────────────────────────────────────────────────────────────────────── */

/* ── Tokens. Both themes are explicit; neither default is implicit. ────────── */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1712; --panel:#221e17; --panel2:#2b261d; --elev:#353023; --well:#131008;
  --line:#3b3527; --line2:#564e3a;
  --text:#f0eadb; --text2:#d6cebc; --muted:#a39a84; --faint:#7a715c;
  --accent:#e08358; --accent2:#ec9a74; --accent-soft:#3a2a20; --on-accent:#1a1712;
  --run:#d9b05e; --runbg:#3c321a; --runln:#5a4a24;
  --ok:#7cbe96; --okbg:#24342a; --okln:#2c4a38;
  --bad:#e08a7b; --badbg:#3d241f; --badln:#4e312b;
  --warn:#d9b05e; --warnbg:#3c321a; --warnln:#5a4a24;
  --info:#7dd6df; --infobg:#1e3539; --infoln:#2e5a60;
  --moss:#8fae97; --mossbg:#26362f; --mossln:#3c5a4b;
  --sweep:rgba(255,255,255,.26);
  --shadow-card:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.30);
  --shadow-pop:0 2px 4px rgba(0,0,0,.30),0 12px 32px rgba(0,0,0,.45);
  --shadow-inset:inset 0 1px 2px rgba(0,0,0,.35);
  --scrim:rgba(10,8,6,.58);
  --grain:rgba(240,234,219,.022);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#faf6ee; --panel:#fffdf7; --panel2:#f2ebdd; --elev:#e7dec9; --well:#f2ebdd;
  --line:#e3dac6; --line2:#c9bea3;
  --text:#231f18; --text2:#3a342a; --muted:#6b6453; --faint:#968d78;
  --accent:#a04a2a; --accent2:#7c381f; --accent-soft:#f4e2d6; --on-accent:#fffdf7;
  --run:#95680f; --runbg:#f3e6c2; --runln:#e6d3a0;
  --ok:#2e7b4f; --okbg:#ddebdb; --okln:#c4dcc9;
  --bad:#b23f2e; --badbg:#f4ddd4; --badln:#e8c9bf;
  --warn:#95680f; --warnbg:#f3e6c2; --warnln:#e6d3a0;
  --info:#2e7a84; --infobg:#ddeef0; --infoln:#bfe0e4;
  --moss:#2f4f41; --mossbg:#e2e9e0; --mossln:#c6d6c8;
  --sweep:rgba(255,255,255,.55);
  --shadow-card:0 1px 2px rgba(58,44,22,.05),0 4px 14px rgba(58,44,22,.06);
  --shadow-pop:0 2px 4px rgba(58,44,22,.07),0 12px 32px rgba(58,44,22,.12);
  --shadow-inset:inset 0 1px 2px rgba(58,44,22,.07);
  --scrim:rgba(35,31,24,.40);
  --grain:rgba(35,31,24,.020);
}
:root{
  --font-ui:'Avenir Next','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Helvetica,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Mono','IBM Plex Mono',Menlo,Consolas,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --r-sm:6px; --r:10px; --r-lg:16px; --r-pill:999px;
  --d1:.12s; --d2:.2s; --d3:.35s; --ease:cubic-bezier(.22,1,.36,1);
  --rail:224px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:15px/1.5 var(--font-ui); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  /* Paper texture: a 4px warm hairline weave. Cheap, no image, invisible until
     you look for it — which is the point. */
  background-image:linear-gradient(var(--grain) 1px,transparent 1px),linear-gradient(90deg,var(--grain) 1px,transparent 1px);
  background-size:26px 26px,26px 26px;
}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px}
a:hover{color:var(--accent2)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sp{flex:1}
.nowrap{white-space:nowrap}
::selection{background:var(--accent-soft);color:var(--text)}

/* ── The signature: uppercase mono micro-label with a hairline rule. ───────── */
.eyebrow{display:flex;align-items:center;gap:var(--s3);font:500 10px/1 var(--font-mono);
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 var(--s3)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow b{font-weight:500;color:var(--accent)}
.mlabel{font:500 10px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ── Controls ─────────────────────────────────────────────────────────────── */
input,button,select,textarea{font:inherit;color:inherit;font-family:var(--font-ui)}
input,select,textarea{width:100%;padding:9px 12px;border-radius:var(--r);background:var(--panel2);
  color:var(--text);border:1px solid var(--line);font-size:13.5px;transition:border-color var(--d1),box-shadow var(--d1)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
textarea{resize:vertical;min-height:76px;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);
  border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;
  white-space:nowrap;width:auto;font-size:13px;font-weight:600;letter-spacing:-.01em;
  transition:border-color var(--d2),background var(--d2),color var(--d2)}
.btn:hover{background:var(--panel2);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.btn.primary:hover{background:var(--accent2);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--badln)}
.btn.danger:hover{background:var(--badbg)}
.btn.danger.solid{background:var(--bad);color:var(--on-accent);border-color:transparent;font-weight:700}
.btn.good{color:var(--ok);border-color:var(--okln)}
.btn.good:hover{background:var(--okbg)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.tiny{padding:4px 10px;font-size:12px;border-radius:var(--r-sm);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:var(--r);
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
  transition:color var(--d2),background var(--d2),border-color var(--d2)}
.iconbtn:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
.iconbtn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.iconbtn svg{width:16px;height:16px}
.chip{padding:5px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);cursor:pointer;font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;
  transition:color var(--d2),background var(--d2),border-color var(--d2)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 42%,transparent);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
kbd{font:500 11px var(--font-mono);background:var(--panel2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:var(--r-sm);padding:1px 6px;color:var(--muted)}

/* ── Sign-in ──────────────────────────────────────────────────────────────── */
#login{max-width:392px;margin:12vh auto;padding:var(--s7) var(--s6) var(--s6);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);position:relative}
#login::before{content:"";position:absolute;inset:-90px -60px auto;height:220px;z-index:-1;
  background:radial-gradient(60% 100% at 50% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);
  filter:blur(28px);pointer-events:none}
#login .seal{width:46px;height:46px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;margin:0 auto var(--s4);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
#login .seal svg{width:24px;height:24px}
#login h2{margin:0 0 var(--s1);text-align:center;font-size:20px;font-weight:700;letter-spacing:-.022em}
#login .lead{margin:0 0 var(--s6);text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
#login .eyebrow{justify-content:center;margin-bottom:var(--s5)}
#login .eyebrow::after,#login .eyebrow::before{content:"";flex:1;height:1px;background:var(--line)}
.pw{position:relative}
.pw input{padding-right:42px;font-family:var(--font-mono);letter-spacing:.06em}
.pw .iconbtn{position:absolute;right:5px;top:4px}
#err{color:var(--bad);font-size:12.5px;min-height:20px;margin-top:var(--s3);text-align:center}
#login .foot{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);
  text-align:center;font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}

/* ── Shell: rail + main ───────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;
  gap:var(--s5);padding:var(--s5) var(--s3) var(--s4);border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--bg) 42%);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2)}
.brand .seal{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.brand .seal svg{width:17px;height:17px}
.brand .wm{font-size:14px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.brand .sub{font:500 9.5px var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup > .mlabel{padding:0 var(--s2) var(--s2)}
.nav{display:flex;align-items:center;gap:10px;padding:8px var(--s2);border-radius:var(--r);
  background:transparent;border:none;color:var(--muted);cursor:pointer;text-align:left;width:100%;
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;position:relative;
  transition:color var(--d2),background var(--d2)}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav.on{color:var(--accent);background:var(--accent-soft)}
.nav.on::before{content:"";position:absolute;left:-13px;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.nav .count{margin-left:auto;font:600 10.5px var(--font-mono);padding:1px 6px;border-radius:var(--r-pill);
  background:var(--bad);color:#fff;letter-spacing:.02em}
.nav .count.q{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line)}
.railfoot .row{display:flex;align-items:center;gap:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--faint) 22%,transparent)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 25%,transparent)}
.dot.run{background:var(--run);box-shadow:0 0 0 3px color-mix(in srgb,var(--run) 25%,transparent);animation:pulse 1.7s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s4);
  padding:var(--s4) var(--s6);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.3) blur(10px)}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stamp{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);white-space:nowrap}
.views{padding:var(--s6) var(--s6) var(--s8);flex:1;min-width:0}
.view{max-width:1360px;margin:0 auto;animation:rise var(--d3) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Panels, tiles, callouts ──────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:var(--shadow-card);margin-bottom:var(--s4)}
.panel > h3{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.018em}
.panel > .hint{color:var(--muted);font-size:12.5px;margin:0 0 var(--s4);line-height:1.55;max-width:76ch}
.panel.flush{padding:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s3)}
.field > label{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.inline{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

/* Stat strip: one bordered slab with internal hairlines — not eight cards. */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s4);box-shadow:var(--shadow-card)}
.tile{padding:var(--s4) var(--s5);border:0;color:inherit;font:inherit;
  background:var(--panel);text-align:left;cursor:default;transition:background var(--d2);position:relative}
.tile.act{cursor:pointer}
.tile.act:hover{background:var(--panel2)}
.tile.act:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.tile .v{display:block;width:100%;font:600 27px/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .k{display:block;width:100%;margin-top:7px;font:500 10px/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.tile.ok .v{color:var(--ok)} .tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)}
.tile.run .v{color:var(--run)} .tile.info .v{color:var(--info)} .tile.moss .v{color:var(--moss)}
.tile.zero .v{color:var(--faint)}

.callout{border:1px solid var(--line);border-radius:var(--r);padding:11px var(--s4);background:var(--panel2);
  display:flex;gap:var(--s3);align-items:flex-start;font-size:13px;line-height:1.5}
.callout + .callout{margin-top:var(--s2)}
.callout .cl{font:500 10px/1.7 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;flex:none;min-width:62px}
.callout .cb{flex:1;min-width:0}
.callout.bad{background:var(--badbg);border-color:var(--badln)} .callout.bad .cl{color:var(--bad)}
.callout.warn{background:var(--warnbg);border-color:var(--warnln)} .callout.warn .cl{color:var(--warn)}
.callout.info{background:var(--infobg);border-color:var(--infoln)} .callout.info .cl{color:var(--info)}
.callout.ok{background:var(--okbg);border-color:var(--okln)} .callout.ok .cl{color:var(--ok)}
.callout .ref{font:500 11px var(--font-mono);color:var(--muted);word-break:break-all}

.pill{display:inline-block;font:600 10.5px var(--font-mono);padding:2px 8px;border-radius:var(--r-pill);
  background:var(--okbg);color:var(--ok);border:1px solid var(--okln);letter-spacing:.04em;white-space:nowrap}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:var(--badln)}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnln)}
.pill.info{background:var(--infobg);color:var(--info);border-color:var(--infoln)}
.pill.run{background:var(--runbg);color:var(--run);border-color:var(--runln)}
.pill.moss{background:var(--mossbg);color:var(--moss);border-color:var(--mossln)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.pill.muted{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;font:500 10.5px var(--font-mono);padding:2px 8px;border-radius:var(--r-sm);
  background:var(--mossbg);color:var(--moss);border:1px solid var(--mossln);margin:0 3px 3px 0;letter-spacing:.04em}

/* ── Progress ─────────────────────────────────────────────────────────────── */
.bar{height:6px;border-radius:var(--r-pill);background:var(--well);box-shadow:var(--shadow-inset);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--run);
  transition:width var(--d3) var(--ease);position:relative;overflow:hidden;min-width:2px}
.bar.live > i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--sweep),transparent);animation:sweep 1.7s var(--ease) infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar.meter > i{background:var(--accent)}
.bar.meter.full > i{background:var(--warn)}
.bar.meter.over > i{background:var(--bad)}
.bar.sm{height:4px}

.runrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2) var(--s4);align-items:center;
  padding:var(--s3) 0;border-top:1px solid var(--line)}
.runrow:first-of-type{border-top:none}
.runrow .who{font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runrow .meta{margin-top:3px;font:500 10.5px var(--font-mono);color:var(--muted);letter-spacing:.04em}
.runrow .cnt{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--run);white-space:nowrap}
.runrow .cnt small{color:var(--muted);font-size:11px;font-weight:500}
.runrow .bar{grid-column:1/-1}

/* ── Timeline ─────────────────────────────────────────────────────────────── */
.tl{position:relative;padding-inline-start:var(--s5);margin:0}
.tl::before{content:"";position:absolute;inset-inline-start:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:7px 0;display:flex;gap:var(--s3);align-items:baseline;font-size:13px}
.tl li::before{content:"";position:absolute;inset-inline-start:calc(-1 * var(--s5) + 1px);top:13px;
  width:7px;height:7px;border-radius:50%;background:var(--line2);box-shadow:0 0 0 3px var(--panel)}
.tl li.ok::before{background:var(--ok)} .tl li.bad::before{background:var(--bad)}
.tl li.warn::before{background:var(--warn)} .tl li.run::before{background:var(--run)}
.tl li.accent::before{background:var(--accent)}
.tl .tt{flex:none;font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);min-width:66px}
.tl .tx{flex:1;min-width:0;line-height:1.5;word-break:break-word}
.tl .tk{flex:none}

/* ── Tables ───────────────────────────────────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  box-shadow:var(--shadow-card);margin-bottom:var(--s3)}
table{width:100%;border-collapse:collapse;font-size:13px}
table.wide{min-width:900px}
th,td{text-align:left;padding:11px var(--s4);border-bottom:1px solid var(--line);vertical-align:top}
:root[data-dense="1"] th,:root[data-dense="1"] td{padding:5px var(--s3)}
tbody tr:last-child td{border-bottom:none}
th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--muted);
  font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .ar{color:var(--accent)}
tbody tr.click{cursor:pointer}
tbody tr:hover > td{background:var(--panel2)}
.uname{font-weight:650;letter-spacing:-.01em}
.usub{color:var(--muted);font-size:11.5px;line-height:1.45}
.act{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:var(--s8) var(--s5);text-align:center;color:var(--muted);font-size:13.5px;
  border:1px dashed var(--line2);border-radius:var(--r-lg);background:var(--panel)}
.empty .big{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.018em}
.empty .mlabel{display:block;margin-bottom:var(--s3)}
.pager{display:flex;gap:var(--s2);align-items:center;justify-content:flex-end;margin-bottom:var(--s4);
  font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.04em}
.toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s4)}
.toolbar .search{flex:1;min-width:220px;max-width:420px}
.bulkbar{position:sticky;bottom:var(--s4);z-index:15;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;
  margin-top:var(--s4);padding:11px var(--s4);background:var(--panel);border:1px solid var(--accent);
  border-radius:var(--r);box-shadow:var(--shadow-pop)}
.bulkbar b{color:var(--accent);font:600 12px var(--font-mono);letter-spacing:.04em}
.copy{cursor:pointer;color:var(--faint);border:none;background:transparent;padding:0 4px;
  font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em}
.copy:hover{color:var(--accent)}
.kv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:7px var(--s3);font-size:13px}
.kv .k{font:500 10px/1.7 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kv .v{word-break:break-word;color:var(--text2)}
.msg{white-space:pre-wrap;max-width:460px;word-break:break-word}
.result{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r);background:var(--panel2);
  border:1px solid var(--line);font-size:12.5px;display:none;line-height:1.6}
.result.show{display:block}
.rins{display:flex;gap:5px;flex-wrap:wrap}
.rins .r{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:2px 8px;font:500 11.5px var(--font-mono)}

/* ── Detail header ────────────────────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;
  font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:var(--s3)}
.back:hover{color:var(--accent)}
.dhead{display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap;padding-bottom:var(--s5);
  margin-bottom:var(--s5);border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:25px;font-weight:700;letter-spacing:-.024em;line-height:1.1}
.dhead .dsub{margin-top:6px;color:var(--muted);font-size:13px}
.dhead .pills{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.dhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}

/* ── Charts (inline SVG, no libraries) ────────────────────────────────────── */
.chartcard svg{width:100%;height:auto;display:block}
.chartcard text.cl{fill:var(--muted);font:500 11px var(--font-mono)}
.chartcard text.cv{fill:var(--text);font:600 11px var(--font-mono)}
.chartcard .axis{fill:var(--faint);font:500 9px var(--font-mono)}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font:500 11px var(--font-mono);color:var(--muted);margin-top:var(--s2);letter-spacing:.04em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:var(--s2)}
.hc{padding:11px var(--s3);border-radius:var(--r);border:1px solid var(--line);background:var(--panel2)}
.hc.ok{border-color:var(--okln);background:var(--okbg)}
.hc.bad{border-color:var(--badln);background:var(--badbg)}
.hc.warn{border-color:var(--warnln);background:var(--warnbg)}
.hc .hl{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hc .hv{font-weight:650;margin-top:4px;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.swtrack{width:40px;height:23px;border-radius:var(--r-pill);background:var(--line2);position:relative;
  transition:background var(--d2);flex:none}
.swtrack::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--panel);transition:transform var(--d2) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch input:checked + .swtrack{background:var(--bad)}
.switch input:checked + .swtrack::after{transform:translateX(17px)}
.switch input:focus-visible + .swtrack{box-shadow:0 0 0 3px var(--accent-soft)}

/* ── Toasts + modal ───────────────────────────────────────────────────────── */
#toasts{position:fixed;right:var(--s4);bottom:var(--s4);z-index:60;display:flex;flex-direction:column;
  gap:var(--s2);max-width:360px;pointer-events:none}
.toast{pointer-events:auto;padding:11px var(--s4);border-radius:var(--r);background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow-pop);font-size:13px;opacity:0;transform:translateY(8px);
  transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);display:flex;gap:9px;align-items:baseline}
.toast.in{opacity:1;transform:none}
.toast .tl2{font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;flex:none}
.toast.ok{border-color:var(--okln)} .toast.ok .tl2{color:var(--ok)}
.toast.bad{border-color:var(--badln)} .toast.bad .tl2{color:var(--bad)}
.toast .tl2.n{color:var(--muted)}
#modal-root{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:var(--s5)}
#modal-root[hidden]{display:none}
.modal-overlay{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px)}
.modal-card{position:relative;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s6);box-shadow:var(--shadow-pop);animation:pop var(--d2) var(--ease)}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.modal-msg{color:var(--muted);font-size:13px;margin-bottom:var(--s5);line-height:1.6}
.modal-label{display:block;font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);margin-bottom:var(--s5)}
.modal-label input,.modal-label select{margin-top:7px}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--s2)}
.demo{background:var(--runbg);border-bottom:1px solid var(--runln);color:var(--run);
  font:500 10px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;padding:6px var(--s6);text-align:center}

/* ── Jobs: the wedged-run alarm and the chunk ladder ──────────────────────── */
/* One square per chunk. Forty of them fit on one line, so a failed or stalled
   chunk is a red square in a field of green — found by eye, not by reading. */
.ladder{display:flex;flex-wrap:wrap;gap:3px;margin:var(--s3) 0}
.ck{width:16px;height:16px;padding:0;border-radius:4px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line2);transition:transform var(--d1)}
.ck:hover{transform:translateY(-2px)}
.ck:focus-visible{outline:none;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.ck.done{background:var(--ok);border-color:var(--ok)}
.ck.run{background:var(--run);border-color:var(--run);animation:pulse 1.7s var(--ease) infinite}
.ck.bad{background:var(--bad);border-color:var(--bad)}
.ck.warn{background:var(--warn);border-color:var(--warn)}
.ck.wait{background:var(--well);border-color:var(--line2)}
tr.ch.bad > td{background:var(--badbg)}
tr.ch.warn > td{background:var(--warnbg)}
tr.ch.run > td{background:var(--runbg)}
tr.ch.hit > td{box-shadow:inset 0 0 0 1px var(--accent)}
tr.wedged > td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.runrow.wedged{background:var(--badbg);box-shadow:inset 3px 0 0 var(--bad);
  border-radius:var(--r);padding-inline:10px;margin-top:2px}
.chip.alarm{border-color:var(--badln);color:var(--bad)}
.chip.alarm:hover{background:var(--badbg);color:var(--bad)}
.chip.alarm.on{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.chip.alarm.on::before{content:"● "}
.warnline{color:var(--warn);font:500 11.5px var(--font-mono);line-height:1.5;word-break:break-word}
.filt{flex:0 1 200px;min-width:132px;width:auto}

/* ── Activation: features and expiry ──────────────────────────────────────── */
/* The left edge carries the SOURCE of a feature — accent means an admin wrote it
   onto this account, muted means the plan did. Fill carries the EFFECT. An admin
   must never have to guess which of the two put a flag there. */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--s2)}
.feat{padding:11px var(--s4);border:1px solid var(--line);border-left:3px solid var(--line2);
  border-radius:var(--r);background:var(--panel2)}
.feat .fh{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.feat .fn{font:600 12.5px var(--font-mono);letter-spacing:.02em;flex:1;min-width:0}
.feat .fw{margin-top:6px;font-size:12px;line-height:1.5;color:var(--muted)}
.feat .fw b{color:var(--text2);font-weight:650}
.feat.on{background:var(--okbg);border-color:var(--okln);border-left-color:var(--ok)}
.feat.ovr{border-left-color:var(--accent);border-left-width:3px}
.feat.ovr.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 38%,transparent);
  border-left-color:var(--accent)}
.feat.unknown{border-left-color:var(--warn)}
.srcbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3);
  padding:9px var(--s4);border-radius:var(--r);border:1px dashed var(--line2);background:var(--panel2);font-size:12.5px}
.srcbar.ovr{border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.exp{font:500 10.5px var(--font-mono);letter-spacing:.04em;margin-top:3px}
.exp.bad{color:var(--bad)} .exp.warn{color:var(--warn)} .exp.ok{color:var(--faint)}
.planrow td{vertical-align:middle}
.planed{border:1px solid var(--accent);border-radius:var(--r);padding:var(--s4);
  background:var(--panel2);margin-bottom:var(--s4)}

/* ── Provenance: every allowance says where it came from ──────────────────── */
/* SPEC-019. A number with no provenance is a number an admin has to guess about.
   Muted = inherited from a plan. Accent = written on this account (an override,
   or a negotiated custom figure). Dashed = the server sent no `source` and this
   is the portal's own reading of the documented rule — said out loud, not hidden. */
.prov{display:inline-block;font:500 9.5px/1.6 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;
  padding:0 6px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);white-space:nowrap;vertical-align:middle}
.prov.own{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:var(--accent-soft);color:var(--accent)}
.prov.derived{border-style:dashed}
.allow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.allow .n2{font:600 12.5px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.allow .n2.full{color:var(--warn)} .allow .n2.over{color:var(--bad)}
.grand{font:500 10.5px var(--font-mono);color:var(--warn);letter-spacing:.04em;margin-top:3px}

/* Catalogue rows. `dead` = deactivated but still granted somewhere — greyed, not
   hidden, because grandfathering means it is still doing work. */
.feat.dead{border-left-color:var(--faint);opacity:.78}
.feat.wired{border-left-color:var(--moss)}
.feat .fd{margin-top:5px;font-size:12.5px;line-height:1.5;color:var(--text2)}
.wirebar{display:flex;gap:var(--s3);align-items:flex-start;padding:11px var(--s4);border-radius:var(--r);
  border:1px solid var(--warnln);background:var(--warnbg);font-size:13px;line-height:1.55;margin-bottom:var(--s4)}
.wirebar .cl{font:500 10px/1.7 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--warn);flex:none;min-width:62px}
.wirebar b{color:var(--text)}
.custed{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r);
  padding:var(--s4);background:var(--accent-soft);margin-top:var(--s3)}

/* ── Responsive: laptop first, then narrow ────────────────────────────────── */
@media(max-width:1180px){
  :root{--rail:64px}
  .rail{align-items:center;padding:var(--s5) var(--s2) var(--s4)}

}

    border-right:none;border-bottom:1px solid var(--line);align-items:center}
  .navgroup{flex-direction:row}
  .railfoot{margin:0 0 0 auto;border-top:none;padding-top:0}
  .railfoot .row{flex-direction:row}
  .nav.on::before{display:none}
  .dhead .acts{margin-left:0;max-width:none}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv .k{margin-top:var(--s2)}
}

  *,::before,::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

<script>
(function(){
'use strict';
/* ───────────────────────────────────────────────────────────────────────────
   ETA Bulk admin console.
   Slice 1 sections (Dashboard / Users / Clients) speak the SPEC-017 contract:
     GET  /api/dashboard   GET /api/users   GET /api/user?email=   POST /api/user
     GET  /api/clients     GET /api/client?rin=                    POST /api/client
     POST /api/migrate
   The legacy sections (Insights / Requests / Bugs / Activity / Tools) keep
   speaking the endpoints they already have. Nothing was dropped to make room.
   Views are rendered from templates into #views — one section mounted at a time.
   ─────────────────────────────────────────────────────────────────────────── */

var DEMO = /(^|[?&])demo=1(&|$)/.test(location.search);

var S = {
  token:'', section:'dashboard',
  dash:null, dashErr:'',
  users:[], utotal:0, upage:1, uq:'', ustatus:'all', uplan:'', usort:{key:'lastSeen',dir:-1}, usel:{},
  user:null, userEmail:'',
  clients:[], ctotal:0, cpage:1, cq:'',
  client:null, clientRin:'',
  jobs:[], jtotal:0, jpage:1, jstate:'', juser:'', jrin:'', jstuck:0, jobsErr:'',
  job:null, jobId:'', jobErr:'',
  plans:[], plansErr:'', plansDone:false, planEdit:null, planRefused:null,
  feats:[], featsErr:'', featsDone:false, featEdit:null, featRefused:null,
  custEdit:null,
  reqs:[], bugs:[], voids:[], audit:[], errs:[], trash:[], snaps:[],
  insights:null, health:null, cfg:{}, stats:null,
  rfilter:'all', bfilter:'all',
  autoTimer:null, lastLoad:0
};
var PAGE = 25;

/* ── tiny helpers ─────────────────────────────────────────────────────────── */
var $ = function(id){ return document.getElementById(id); };
function q(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n(v){ return Number(v||0).toLocaleString('en-US'); }
/* Field names are not pinned by the contract for devices/jobs (the SQL is snake_case,
   the JSON elsewhere is camelCase). Read whichever arrives. */
function f(o){ if(!o) return null; for(var i=1;i<arguments.length;i++){ var k=arguments[i]; if(o[k]!=null&&o[k]!=='') return o[k]; } return null; }
function cairo(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }catch(e){ return String(iso).slice(0,16).replace('T',' '); } }
function rel(iso){ if(!iso) return ''; var t=Date.parse(iso); if(!t) return ''; var s=(Date.now()-t)/1000; if(s<0)s=0;
  if(s<60) return 'just now'; var m=s/60; if(m<60) return Math.floor(m)+'m ago'; var h=m/60; if(h<24) return Math.floor(h)+'h ago';
  var d=h/24; if(d<30) return Math.floor(d)+'d ago'; var mo=d/30; if(mo<12) return Math.floor(mo)+'mo ago'; return Math.floor(d/365)+'y ago'; }
function when(iso){ var c=cairo(iso), r=rel(iso); return '<span title="'+esc(c)+' Cairo">'+esc(r||c)+'</span>'; }
function days(iso){ if(!iso) return null; var t=Date.parse(iso); if(!t) return null; return (t-Date.now())/86400000; }
function ago(iso){ if(!iso) return null; var t=Date.parse(iso); if(!t) return null; return (Date.now()-t)/86400000; }
function pct(a,b){ b=Number(b||0); if(!b) return 0; return Math.max(0,Math.min(100,Math.round(Number(a||0)/b*100))); }

/* ── transport ────────────────────────────────────────────────────────────── */
function authFetch(p,opts){ opts=opts||{}; var h=opts.headers||{}; h['authorization']='Bearer '+S.token; opts.headers=h; return fetch(p,opts); }
function api(p){
  if(DEMO) return Promise.resolve(demoGet(p));
  return authFetch(p).then(function(r){ return r.json().catch(function(){ return {ok:false,error:'bad response'}; }); })
    .catch(function(){ return {ok:false,error:'network'}; });
}
/* `quiet` suppresses the automatic toast so the caller can render a refusal in
   full — a 409 from /api/plan/delete carries a reason and a count, and a toast
   that says "conflict" throws both away. The HTTP status is kept as `_status`
   because the body alone cannot tell "refused" from "failed". */
function post(p,body,quiet){
  if(DEMO){ toast('Demo mode — nothing was written','n'); return Promise.resolve({ok:false,error:'demo'}); }
  return authFetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){
      return r.json().catch(function(){ return {ok:false,error:'HTTP '+r.status}; })
        .then(function(j){ j=j||{ok:false}; j._status=r.status; return j; });
    })
    .then(function(j){ if(!j.ok&&!quiet) toast(j.error||'Request failed','bad'); return j; })
    .catch(function(){ if(!quiet) toast('Network error','bad'); return {ok:false,error:'network'}; });
}
function download(path,filename){
  if(DEMO){ toast('Demo mode — nothing to export','n'); return; }
  authFetch(path).then(function(r){ return r.blob(); }).then(function(b){
    var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
  }).catch(function(){ toast('Export failed','bad'); });
}
function setConn(state){ var d=$('conn'); d.className='dot '+state; d.title = state==='on'?'Connected':state==='run'?'Loading':'Authentication error'; }

/* ── toast + modal ────────────────────────────────────────────────────────── */
function toast(msg,type,ms){
  var c=$('toasts'), el=document.createElement('div');
  var kind = type==='bad'?'bad':type==='ok'?'ok':'n';
  el.className='toast '+(kind==='n'?'':kind);
  el.innerHTML='<span class="tl2 '+(kind==='n'?'n':'')+'">'+(kind==='bad'?'Failed':kind==='ok'?'Done':'Note')+'</span><span>'+esc(msg)+'</span>';
  c.appendChild(el); requestAnimationFrame(function(){ el.classList.add('in'); });
  setTimeout(function(){ el.classList.remove('in'); setTimeout(function(){ el.remove(); },260); }, ms||2800);
}
function modal(o){
  o=o||{};
  return new Promise(function(resolve){
    var root=$('modal-root'), inp=o.input||{}, hasInput=!!o.input, opts=inp.options, control='';
    if(hasInput){
      if(opts) control='<select id="modal-input">'+opts.map(function(op){ return '<option value="'+esc(op.value)+'">'+esc(op.label)+'</option>'; }).join('')+'</select>';
      else if(inp.type==='textarea') control='<textarea id="modal-input" placeholder="'+esc(inp.placeholder||'')+'"></textarea>';
      else control='<input id="modal-input" type="'+esc(inp.type||'text')+'"'+(inp.min!=null?' min="'+esc(inp.min)+'"':'')+' placeholder="'+esc(inp.placeholder||'')+'">';
    }
    root.innerHTML='<div class="modal-overlay"></div><div class="modal-card" role="dialog" aria-modal="true" aria-label="'+esc(o.title||'Confirm')+'">'
      +'<div class="modal-title">'+esc(o.title||'Confirm')+'</div>'
      +(o.message?'<div class="modal-msg">'+esc(o.message)+'</div>':'')
      +(hasInput?'<label class="modal-label">'+esc(inp.label||'')+control+'</label>':'')
      +'<div class="modal-foot"><button class="btn ghost" id="modal-cancel">'+esc(o.cancelText||'Cancel')+'</button>'
      +'<button class="btn '+(o.danger?'danger solid':'primary')+'" id="modal-ok">'+esc(o.confirmText||'Confirm')+'</button></div></div>';
    root.hidden=false;
    var field=$('modal-input');
    /* Setting .value on a <select> selects the matching option — so a dropdown
       opens on what is already true rather than on whatever is first. */
    if(field){ if(inp.value!=null) field.value=inp.value; setTimeout(function(){ field.focus(); try{ field.select(); }catch(e){} },20); }
    else setTimeout(function(){ $('modal-ok').focus(); },20);
    function done(v){ root.hidden=true; root.innerHTML=''; document.removeEventListener('keydown',onkey); resolve(v); }
    function ok(){ done(hasInput?(field?field.value:''):true); }
    $('modal-ok').onclick=ok; $('modal-cancel').onclick=function(){ done(null); };
    root.querySelector('.modal-overlay').onclick=function(){ done(null); };
    function onkey(e){
      if(e.key==='Escape'){ e.stopPropagation(); done(null); return; }
      if(e.key==='Enter'&&!(field&&field.tagName==='TEXTAREA')){ var a=document.activeElement; if(a&&a.id==='modal-cancel'){ done(null); return; } ok(); }
    }
    document.addEventListener('keydown',onkey);
  });
}
function confirmDanger(title,message,confirmText){ return modal({title:title,message:message,confirmText:confirmText||'Confirm',danger:true}); }

function sectionMeta(id){
  if(DETAIL[id]) return DETAIL[id];
  for(var g=0; g<SECTIONS.length; g++) for(var i=0; i<SECTIONS[g].items.length; i++) if(SECTIONS[g].items[i].id===id) return SECTIONS[g].items[i];
  return SECTIONS[0].items[0];
}
function renderNav(){
  var pending = S.reqs.filter(function(r){ return r.status==='pending'; }).length;
  var open = S.bugs.filter(function(g){ return g.status==='open'; }).length;
  /* The wedged count rides on the rail so "is anything stuck" is answered from
     every section, not only from the two that happen to list jobs. */
  var counts = {requests:pending, bugs:open, jobs:stuckIds().length};
  var active = DETAIL[S.section] ? DETAIL[S.section].parent : S.section;
  $('nav').innerHTML = SECTIONS.map(function(g){
    return '<div class="navgroup" style="margin-bottom:14px"><div class="mlabel">'+esc(g.group)+'</div>'
      + g.items.map(function(it){
          var c = counts[it.id];
          var tip = it.label + (c && it.id==='jobs' ? ' — '+c+' wedged right now' : '');
          return '<button class="nav'+(active===it.id?' on':'')+'" data-go="'+it.id+'" title="'+esc(tip)+'">'
            + ic(it.icon) + '<span class="lbl">'+esc(it.label)+'</span>'
            + (c?'<span class="count">'+c+'</span>':'') + '</button>';
        }).join('')
      + '</div>';
  }).join('');
  q('#nav [data-go]', function(b){ b.onclick=function(){ go(b.getAttribute('data-go')); }; });
}

/* ── router ───────────────────────────────────────────────────────────────── */
var RENDER = {};   /* filled in below, one per section */
function go(section, arg){
  S.section = section;
  if(section==='user') S.userEmail = arg || S.userEmail;
  if(section==='client') S.clientRin = arg || S.clientRin;
  var m = sectionMeta(section);
  $('ptitle').textContent = m.title;
  $('psub').textContent = m.sub;
  renderNav();
  paint();
  document.querySelector('.views').scrollTop = 0;
  window.scrollTo(0,0);
}
function paint(){
  var fn = RENDER[S.section];
  if(!fn) return;
  $('views').innerHTML = '<section class="view">' + fn() + '</section>';
  wire();
}
var WIRE = {};
function wire(){ var fn = WIRE[S.section]; if(fn) fn(); }
/* Repaint only if the section that owns this data is on screen — and never while
   the operator is typing into it, because a background refresh must not eat a
   half-written announcement or note. */
function repaint(section){
  if(S.section!==section) return;
  var a=document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest && a.closest('#views')){ S._stale=section; return; }
  paint();
}
function stamp(){ S.lastLoad=Date.now(); $('stamp').textContent = 'Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }

/* ── loaders ──────────────────────────────────────────────────────────────── */
function guard(j){ if(j&&j.error==='unauthorized'){ logout(); return false; } return true; }

function loadDashboard(){
  return api('/api/dashboard').then(function(j){
    if(!guard(j)) return;
    if(j.ok){ S.dash=j; S.dashErr=''; setConn('on'); }
    else { S.dash=null; S.dashErr=j.error||'unavailable'; }
    repaint('dashboard');
  });
}
function usersQuery(){
  return '/api/users?q='+encodeURIComponent(S.uq)+'&status='+encodeURIComponent(S.ustatus==='all'?'':S.ustatus)
       + '&plan='+encodeURIComponent(S.uplan)+'&page='+S.upage;
}
function loadUsers(){
  return api(usersQuery()).then(function(j){
    if(!guard(j)) return;
    if(j.ok){ S.users=j.users||[]; S.utotal=(j.total!=null?j.total:S.users.length); S.usersErr=''; setConn('on'); }
    else { S.users=[]; S.utotal=0; S.usersErr=j.error||'unavailable'; }
    repaint('users');
  });
}

  S.user=null; repaint('user');

    repaint('user');

}

/* ── auth ─────────────────────────────────────────────────────────────────── */
function openApp(){ $('login').hidden=true; $('shell').hidden=false; $('demobar').hidden=!DEMO; go(S.section); loadAll(); }
function logout(){
  S.token=''; try{ sessionStorage.removeItem('at'); }catch(e){}
  if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer=null; $('auto').classList.remove('on'); }
  S.section='dashboard'; S.usel={}; S.upage=1; S.uq=''; S.ustatus='all'; S.uplan=''; S.cpage=1; S.cq='';
  S.dash=null; S.users=[]; S.clients=[]; S.user=null; S.client=null;
  S.jobs=[]; S.job=null; S.jobId=''; S.jpage=1; S.jstate=''; S.juser=''; S.jrin=''; S.jstuck=0;
  S.plans=[]; S.plansDone=false; S.planEdit=null; S.planRefused=null;
  S.feats=[]; S.featsDone=false; S.featEdit=null; S.featRefused=null; S.custEdit=null;
  $('shell').hidden=true; $('login').hidden=false; $('token').value=''; $('err').textContent='';
  setConn(''); $('stamp').textContent='';
}
function attemptLogin(){
  var t=$('token').value.trim();
  if(!t && !DEMO){ $('err').textContent='Enter your admin token.'; return; }
  S.token=t; $('err').textContent='';
  api('/api/stats').then(function(j){
    if(!j.ok && !DEMO){
      setConn('off');
      $('err').textContent = j.error==='unauthorized' ? 'That token was rejected.' : 'Could not reach the server.';
      S.token=''; return;
    }
    try{ sessionStorage.setItem('at',S.token); }catch(e){}
    setConn('on'); openApp();
  });
}

/* ═══ DASHBOARD ═══════════════════════════════════════════════════════════ */
function alertClass(l){ l=String(l||'').toLowerCase(); if(/err|danger|crit|high|stuck|fail/.test(l)) return 'bad'; if(/warn|expir|medium/.test(l)) return 'warn'; if(/ok|good/.test(l)) return 'ok'; return 'info'; }
function eventClass(k){ k=String(k||'').toLowerCase(); if(/fail|error|kill|delete|void|deny|stuck/.test(k)) return 'bad'; if(/lock|warn|expir/.test(k)) return 'warn'; if(/run|start|progress|job/.test(k)) return 'run'; if(/done|complete|approve|unlock|revive/.test(k)) return 'ok'; return 'accent'; }
function jobStateClass(s){ s=String(s||'').toLowerCase(); if(/fail|error|dead|abandon/.test(s)) return 'bad'; if(/done|complete/.test(s)) return 'ok'; if(/wait|queue|pending/.test(s)) return 'info'; return 'run'; }

/* ── jobs vocabulary ──────────────────────────────────────────────────────── */
/* The contract defines stuck as running|merging with updated_at older than 30
   minutes. The server filters on it; the client recomputes it so a row already
   on screen can be badged without asking again. Same rule, one place. */
var STUCK_MIN = 30;
function jobId(j){ return String(f(j,'jobId','job_id','id')||''); }
function jobState(j){ return String(f(j,'state','status')||'').toLowerCase(); }
function jobSeen(j){ return f(j,'updatedAt','updated_at','createdAt','created_at'); }
function isStuck(j){
  var st=jobState(j); if(st!=='running'&&st!=='merging') return false;
  var t=Date.parse(jobSeen(j)||''); if(!t) return false;
  return (Date.now()-t) > STUCK_MIN*60000;
}
function stuckIds(){
  var m={}, all=((S.dash&&S.dash.active)||[]).concat(S.jobs||[]);
  all.forEach(function(j){ if(isStuck(j)) m[jobId(j)]=1; });
  return Object.keys(m);
}
function dayRange(a,b){
  a=a?String(a).slice(0,10):''; b=b?String(b).slice(0,10):'';
  if(!a&&!b) return '—';
  if(a&&b&&a===b) return a;
  return (a||'…')+' &rarr; '+(b||'…');
}

/* ── feature vocabulary ───────────────────────────────────────────────────── */
/* SPEC-019: features are DATA now. The catalogue arrives from GET /api/features and
   every editor toggles from it, because typing a feature name into a free-text box is
   how a plan silently stops granting anything. Flags found in the data that are NOT in
   the catalogue are still rendered — flagged as unknown rather than hidden.

   WIRED is the honest half and does not come from the server, because the server
   cannot know it: a catalogue row is a label until a line in the EXTENSION asks for
   the id by name. These two ids are asked for. Nothing else is. */
var WIRED = {
  'auto-reject':  'Wired. <span class="mono">src/ui/flow.js</span> asks for this id by name — granting it shows the Rejection tab and its scan/submit flow.',
  'po-analytics': 'Wired. Gates the purchase-order reconciliation card.'
};
function isWired(id){ return Object.prototype.hasOwnProperty.call(WIRED,String(id)); }
/* The two rows ensureSchema() seeds. Used only until /api/features answers, so the
   plan editor is never a blank box on a portal whose backend half is not deployed. */
var SEED_FEATURES = [
  {id:'auto-reject',  name:'Auto rejection',    description:'The Rejection tab and its scan/submit flow', active:1},
  {id:'po-analytics', name:'PO reconciliation', description:'The purchase-order matching card',           active:1}
];
function catalogueFallback(){ return !(S.feats && S.feats.length); }
function catalogue(){
  if(S.feats && S.feats.length) return S.feats;
  return (S.featsDone && !S.featsErr) ? [] : SEED_FEATURES;
}
function featureKnown(id){ var c=catalogue(); for(var i=0;i<c.length;i++) if(String(c[i].id)===String(id)) return c[i]; return null; }
function featureActive(id){ var m=featureKnown(id); return !!(m && Number(m.active)); }
function featureLabel(id){ var m=featureKnown(id); return (m && m.name) ? m.name : String(id); }
/* Which plans grant an id, and how many loaded accounts carry it in an override.
   The same two numbers the server names when it refuses a delete — shown before the
   admin clicks, so the refusal is a confirmation rather than a surprise. */
function featureUse(id){
  var plans=(S.plans||[]).filter(function(p){ return (featList(p.features)||[]).indexOf(id)>=0; }).map(function(p){ return String(p.id); });
  var users=0;
  (S.users||[]).forEach(function(u){ var o=featList(u.features); if(o && o.indexOf(id)>=0) users++; });
  return {plans:plans, users:users};
}
/* null  = no per-user override, the plan decides.
   []    = a deliberate empty override — the plan is ignored and nothing is granted. */
function featList(v){
  if(v==null||v==='') return null;
  if(Array.isArray(v)) return v.map(String);
  if(typeof v==='string'){
    var s=v.trim(); if(!s) return [];
    if(s.charAt(0)==='['){ try{ var a=JSON.parse(s); return Array.isArray(a)?a.map(String):[]; }catch(e){} }
    return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  }
  return [];
}
function planById(id){
  for(var i=0;i<(S.plans||[]).length;i++) if(String(S.plans[i].id)===String(id)) return S.plans[i];
  return null;
}
/* `custom` is a reserved plan id, not a plan: it detaches the account from the plan
   table entirely. No plan row exists for it and none is ever consulted. */
function isCustom(u){ return String((u&&u.plan)||'')==='custom'; }
/* The one computation the whole Activation slice turns on: what does this user
   actually get, and WHICH of the two sources put it there. */
function featureView(u){
  u=u||{};
  var ovr = featList(u.features);
  var cust = isCustom(u);
  var pl  = cust ? null : planById(u.plan);
  var plf = pl ? (featList(pl.features)||[]) : null;   /* null = plan unknown */
  return { ovr:ovr, plan:pl, planFeats:plf, custom:cust, eff:(ovr!=null ? ovr : (plf||[])) };
}
function featureIds(v){
  var seen={}, out=[];
  catalogue().forEach(function(x){ seen[x.id]=1; out.push(String(x.id)); });
  [].concat(v.eff||[], v.ovr||[], v.planFeats||[]).forEach(function(id){
    id=String(id); if(!seen[id]){ seen[id]=1; out.push(id); }
  });
  return out;
}

/* ── allowances and their provenance ──────────────────────────────────────── */
/* SPEC-019 asks the portal to show, for every account, both what it gets AND where
   that came from — `25 clients (from pro)` versus `12 clients (custom)`. The contract
   pins the idea (a `source` per value) rather than the field names, so read every
   plausible carrier and, when nothing arrives, derive the answer from the documented
   rule and SAY that it was derived. A dashed tag is honest; a confident wrong one
   is the thing this whole feature exists to prevent. */
function srcField(u,key){
  if(!u) return null;
  var bag = u.sources || u.source;
  if(bag && typeof bag==='object' && bag[key]!=null && bag[key]!=='') return String(bag[key]);
  var d = f(u, key+'Source', key+'_source');
  return d==null ? null : String(d);
}
function numOr(v){ if(v==null||v===''||isNaN(Number(v))) return null; return Number(v); }
/* kind: 'quota' (clients) | 'device' (browsers). Returns
   {value, own, planValue, src, derived} where src is 'custom' | 'override' | a plan id. */
function allowance(u,kind){
  u=u||{};
  var own  = kind==='device' ? numOr(f(u,'deviceQuota','device_quota')) : numOr(u.quota);
  var pl   = isCustom(u) ? null : planById(u.plan);
  var plv  = pl ? (kind==='device' ? numOr(f(pl,'deviceQuota','device_quota')) : numOr(pl.quota)) : null;
  var told = srcField(u, kind==='device' ? 'deviceQuota' : 'quota');
  var eff  = numOr(f(u, kind==='device' ? 'effectiveDeviceQuota' : 'effectiveQuota'));
  var src, derived=!told;
  if(isCustom(u)){
    /* The override is the ONLY source here: MAX(user,plan) is deliberately NOT applied,
       or a cap negotiated LOWER than a standard plan would be impossible to write. */
    if(eff==null) eff=own;
    src = told || 'custom';
  } else if(own!=null && plv!=null){
    if(eff==null) eff = Math.max(own,plv);
    src = told || (eff>plv ? 'override' : String(u.plan||''));
  } else if(own!=null){
    if(eff==null) eff=own;
    src = told || 'override';
  } else {
    if(eff==null) eff=plv;
    src = told || (plv!=null ? String(u.plan||'') : null);
  }
  return {value:eff, own:own, planValue:plv, src:src, derived:derived};
}
/* The tag itself. `from pro` (inherited) · `custom` (negotiated) · `override`
   (written on top of a plan). Dashed when the portal worked it out rather than
   being told, so nobody reads a guess as a fact. */
function provTag(a){
  if(!a || !a.src) return '<span class="prov derived" title="No plan on record and nothing written on the account — this number has no traceable source.">source unknown</span>';
  var own = a.src==='custom' || a.src==='override' || a.src==='user';
  var txt = a.src==='custom' ? 'custom' : (a.src==='override'||a.src==='user') ? 'override' : ('from '+a.src.replace(/^plan:/,''));
  var tip = a.src==='custom'
      ? 'Negotiated on this account. No plan is consulted, and no edit to any plan can change it.'
    : own
      ? 'Written on this account and larger than the plan, so it wins. Effective = MAX(account, plan)'+(a.planValue!=null?' — plan gives '+a.planValue+'.':'.')
      : 'Inherited from plan '+a.src.replace(/^plan:/,'')+'. Editing that plan changes this number'+(a.own!=null?'; the account also carries '+a.own+', which is not larger so it does not win.':'.');
  if(a.derived) tip += ' — Derived by the portal from the documented rule; the server sent no source for this value.';
  return '<span class="prov'+(own?' own':'')+(a.derived?' derived':'')+'" title="'+esc(tip)+'">'+esc(txt)+'</span>';
}
/* "4 / 25 clients (from pro)" — used by the table, the detail page and the strip, so
   the same number never reads two different ways in two places. */
function allowLine(used,a,noun,opts){
  opts=opts||{};
  var cap=a.value, u2=Number(used||0);
  var cls = cap!=null && u2>cap ? ' over' : cap!=null && u2>=cap ? ' full' : '';
  var over = cap!=null && u2>cap;
  return '<div class="allow"><span class="n2'+cls+'">'+n(u2)+' / '+(cap==null?'∞':n(cap))+'</span>'
    + (opts.noun?'<span class="usub">'+esc(noun)+'</span>':'')
    + provTag(a) + '</div>'
    + (cap!=null&&!opts.nobar ? '<div class="bar sm meter'+cls+'" style="margin-top:5px;max-width:82px"><i style="width:'+pct(u2,cap)+'%"></i></div>' : '')
    + (over&&!opts.noflag ? '<div class="grand">over allowance &mdash; grandfathered</div>' : '');
}
/* Accounts holding more than they are allowed. They are not broken: every existing
   record keeps working and only the NEXT one is refused. The list exists so an admin
   sees them, not so an admin panics about them. */
function overCap(list,kind){
  return (list||S.users||[]).filter(function(u){
    var a=allowance(u,kind); if(a.value==null) return false;
    var held = kind==='device' ? Number(f(u,'deviceCount','device_count')||0) : Number(u.clientCount||0);
    return held>a.value;
  });
}
function expiryCell(u){
  var raw=u&&u.validUntil;
  if(raw==null||raw==='') return '<div class="usub">no expiry set</div>';
  var d=days(raw), iso=String(raw).slice(0,10);
  if(d==null) return '<div class="usub num">'+esc(iso)+'</div>';
  var cls = d<0?'bad' : d<=14?'warn' : 'ok';
  var txt = d<0 ? ('expired '+Math.max(1,Math.floor(-d))+'d ago') : (Math.ceil(d)+'d left');
  return '<div class="usub num">'+esc(iso)+'</div><div class="exp '+cls+'">'+txt+'</div>';
}
function expiryBuckets(list){
  var exp=[], soon=[];
  (list||S.users||[]).forEach(function(u){
    var d=days(u.validUntil); if(d==null) return;
    if(d<0) exp.push(u); else if(d<=14) soon.push(u);
  });
  var by=function(a,b){ return String(a.validUntil).localeCompare(String(b.validUntil)); };
  return {exp:exp.sort(by), soon:soon.sort(by)};
}

RENDER.dashboard = function(){
  if(!S.dash){
    return '<div class="empty"><span class="mlabel">Dashboard</span><div class="big">'
      + (S.dashErr ? 'GET /api/dashboard is not answering' : 'Loading…') + '</div>'
      + (S.dashErr ? 'The server returned <span class="mono">'+esc(S.dashErr)+'</span>. Slice 1&#39;s backend half may not be deployed yet — every other section below still works against its own endpoint.' : '')
      + '</div>';
  }
  var st = S.dash.stats||{}, active=S.dash.active||[], recent=S.dash.recent||[], alerts=S.dash.alerts||[];
  var tiles = [
    {k:'Users',    v:st.users,    go:'users'},
    {k:'Clients',  v:st.clients,  go:'clients'},
    {k:'Devices',  v:st.devices,  c:'moss'},
    {k:'Running now', v:st.activeJobs, c:'run', go:'jobs'},
    /* Derived, not reported: same 30-minute rule the stuck filter uses. */
    {k:'Wedged &gt;'+STUCK_MIN+'m', v:stuckIds().length, c:'bad', go:'jobs', extra:' data-stuck="1"'},
    {k:'Jobs today',  v:st.jobsToday, go:'jobs'},
    {k:'Docs today',  v:st.docsToday, c:'info'},
    {k:'Open bugs',   v:st.openBugs,  c:'bad',  go:'bugs'},
    {k:'Pending RIN', v:st.pendingRequests, c:'warn', go:'requests'},
    {k:'Expiring 14d',v:st.expiringSoon, c:'warn', go:'users', extra:' data-expiry="1"'}
  ];
  var strip = '<div class="strip">'+tiles.map(function(t){
    var zero = !Number(t.v);
    return '<'+(t.go?'button':'div')+' class="tile'+(t.c&&!zero?' '+t.c:'')+(zero?' zero':'')+(t.go?' act':'')+'"'
      + (t.go?' data-go="'+t.go+'"'+(t.extra||''):'')+'>'
      + '<div class="v">'+n(t.v)+'</div><div class="k">'+t.k+'</div></'+(t.go?'button':'div')+'>';
  }).join('')+'</div>';

  var live = '<div class="panel"><div class="eyebrow">Live now'+(active.length?' &middot; <b>'+active.length+'</b>':'')+'</div>'
    + (active.length ? active.map(function(a){
        var p = pct(a.done,a.total), stk=isStuck(a), id=jobId(a);
        return '<div class="runrow'+(stk?' wedged':'')+'" style="cursor:pointer" data-jopen="'+esc(id)+'" title="Open the chunk timeline">'
          + '<div><div class="who">'+esc(a.user||'—')+' <span class="faint">&rarr;</span> <span class="num">'+esc(a.rin||'')+'</span></div>'
          + '<div class="meta">'+esc(a.source||'')+' &middot; '+esc(id).slice(0,12)+' &middot; '+esc(rel(a.updatedAt)||'')+'</div></div>'
          + '<div style="text-align:right"><span class="pill '+(stk?'bad':jobStateClass(a.state))+'">'+(stk?'STUCK':esc(a.state||'running'))+'</span>'
          + '<div class="cnt" style="margin-top:5px">'+n(a.done)+'<small> / '+n(a.total)+'</small></div></div>'
          + '<div class="bar'+(stk?'':' live')+'"><i style="width:'+p+'%'+(stk?';background:var(--bad)':'')+'"></i></div>'
          + '</div>';
      }).join('')
      : '<div class="muted" style="font-size:13px;padding:6px 0">Nothing running. Runs appear here the moment an extension starts one.</div>')
    + '</div>';

  var alertBox = '<div class="panel"><div class="eyebrow">Needs a decision'+(alerts.length?' &middot; <b>'+alerts.length+'</b>':'')+'</div>'
    + (alerts.length ? alerts.map(function(a){
        var c=alertClass(a.level), ref=String(a.ref||'');
        /* A stuck-job alert that cannot be opened is a sentence, not a tool. */
        var jump = /^job/i.test(ref) ? '<button class="btn tiny" data-jopen2="'+esc(ref)+'" style="margin-top:7px">Open run</button>' : '';
        return '<div class="callout '+c+'"><span class="cl">'+esc(a.level||c)+'</span><span class="cb">'+esc(a.text||'')
          + (ref?'<div class="ref">'+esc(ref)+'</div>':'')+jump+'</span></div>';
      }).join('')
      : '<div class="callout ok"><span class="cl">Clear</span><span class="cb">No stuck jobs, no plans expiring inside 14 days, no error spike.</span></div>')
    + '</div>';

  /* The tile counts the estate; this names the accounts, from the Users page that
     is already loaded. Said plainly rather than implying it is the whole list. */
  var eb=expiryBuckets(), expRows=eb.exp.concat(eb.soon).slice(0,8);
  var expiring = '<div class="panel"><div class="eyebrow">Plans expiring'+(expRows.length?' &middot; <b>'+(eb.exp.length+eb.soon.length)+'</b>':'')+'</div>'
    + (expRows.length
      ? expRows.map(function(u){
          var d=days(u.validUntil), bad=d<0;

            + '<span class="cl">'+(bad?'expired':Math.ceil(d)+'d')+'</span>'
            + '<span class="cb">'+esc(u.name||u.email||'—')+' <span class="usub">'+esc(u.plan||'free')+'</span>'
            + '<div class="ref">'+esc(String(u.validUntil).slice(0,10))+' &middot; '+esc(u.email||'')+'</div></span></div>';
        }).join('')
        + '<div class="usub" style="margin-top:10px">Names come from the loaded Users page; the tile above counts the estate.</div>'
      : '<div class="callout ok"><span class="cl">Clear</span><span class="cb">No loaded account expires inside 14 days.</span></div>')
    + '</div>';

  var feed = '<div class="panel"><div class="eyebrow">Recent events</div>'
    + (recent.length ? '<ul class="tl">'+recent.map(function(e){
        return '<li class="'+eventClass(e.kind)+'"><span class="tt">'+esc(rel(e.at)||'—')+'</span>'
          + '<span class="tx">'+esc(e.text||'')+(e.ref?' <span class="mono faint">'+esc(e.ref)+'</span>':'')+'</span>'
          + '<span class="tk"><span class="pill muted">'+esc(e.kind||'event')+'</span></span></li>';
      }).join('')+'</ul>'
      : '<div class="muted" style="font-size:13px">No events recorded yet.</div>')
    + '</div>';

  return strip + '<div class="split">'+live+'<div>'+alertBox+expiring+'</div></div>' + feed;
};

/* ═══ USERS ═══════════════════════════════════════════════════════════════ */
function userPills(u){
  var p=[], st=String(u.status||'active').toLowerCase();
  if(u.superadmin) p.push('<span class="pill moss">SUPER</span>');
  if(st==='killed') p.push('<span class="pill bad">KILLED</span>');
  else if(st==='locked') p.push('<span class="pill warn">LOCKED</span>');
  else p.push('<span class="pill">active</span>');
  var d = days(u.validUntil);
  if(d!=null){ if(d<0) p.push('<span class="pill bad">EXPIRED</span>'); else if(d<=14) p.push('<span class="pill warn">'+Math.ceil(d)+'d left</span>'); }
  if(!u.lastSeen) p.push('<span class="pill muted">never seen</span>');
  else { var a=ago(u.lastSeen); if(a!=null&&a>=30) p.push('<span class="pill muted">dormant</span>'); }
  return p.join(' ');
}
function quotaCell(u){ return allowLine(u.clientCount, allowance(u,'quota'), 'clients'); }
/* SPEC-019's second half. Devices were unlimited; the column now reads against an
   allowance and says where the allowance came from, exactly as clients do. */
function deviceCell(u){ return allowLine(f(u,'deviceCount','device_count'), allowance(u,'device'), 'devices'); }
function planOptions(sel){
  var seen={}; S.users.forEach(function(u){ if(u.plan) seen[u.plan]=1; });
  (S.plans||[]).forEach(function(p){ if(p.id) seen[p.id]=1; });
  ['free','standard','pro','custom'].forEach(function(p){ if(!(p in seen)) seen[p]=1; });
  return '<option value="">All plans</option>'+Object.keys(seen).sort().map(function(p){
    return '<option value="'+esc(p)+'"'+(sel===p?' selected':'')+'>'+esc(p)+'</option>'; }).join('');
}
function pager(id,page,total){
  var pages=Math.max(1,Math.ceil(total/PAGE));
  if(total<=PAGE) return '';
  return '<div class="pager"><button class="btn tiny" data-pg="'+id+':prev"'+(page<=1?' disabled':'')+'>&larr; Prev</button>'
    + '<span>Page '+page+' / '+pages+' &middot; '+n(total)+' rows</span>'
    + '<button class="btn tiny" data-pg="'+id+':next"'+(page>=pages?' disabled':'')+'>Next &rarr;</button></div>';
}
function sortPage(rows,sort){
  return rows.slice().sort(function(a,b){
    var k=sort.key, va,vb;
    if(k==='name'){ va=String(a.name||a.email||'').toLowerCase(); vb=String(b.name||b.email||'').toLowerCase(); }
    else if(k==='docs'){ va=Number(a.docs||0); vb=Number(b.docs||0); }
    /* No expiry is not "expires first" — it sorts to the far end, so ascending
       puts the accounts that are actually about to be refused at the top. */
    else if(k==='validUntil'){ va=String(a.validUntil||'9999'); vb=String(b.validUntil||'9999'); }
    else { va=a[k]||''; vb=b[k]||''; }
    return va<vb?-sort.dir:va>vb?sort.dir:0;
  });
}
function sortHead(key,label,sort){
  return '<th class="sortable" data-sort="'+key+'">'+esc(label)+(sort.key===key?' <span class="ar">'+(sort.dir>0?'↑':'↓')+'</span>':'')+'</th>';
}

        + '<button class="btn tiny" data-open2="'+e+'">Open</button></div></td></tr>';

  /* Expiry is a real answer now that slice 3 makes valid_until binding, so the
     page says how many of its own rows are already refused or about to be. */
  var eb=expiryBuckets();
  var expBar = (eb.exp.length||eb.soon.length)
    ? '<div class="callout '+(eb.exp.length?'bad':'warn')+'" style="margin-bottom:16px"><span class="cl">expiry</span><span class="cb">'

      + '<button class="btn tiny ghost" data-go2="activation">Open Activation</button></div></span></div>'
    : '';

     they already hold keeps working, and only the next one is refused. Said in those
     words on purpose: an admin who reads this as an outage starts unregistering
     browsers, which is the one thing SPEC-019 promises never happens by itself. */

  return head + expBar + capBar

        + '<button class="btn tiny danger" data-bulk="delete">Delete</button>'
        + '<button class="btn tiny ghost" id="bulkclear">Clear</button></div>' : '');
};

function openUser(email){ S.userEmail=email; S.user=null; go('user',email); loadUser(email); }
function actUser(email,action,value){ return post('/api/user',{email:email,action:action,value:value}); }
function bulk(action){
  var ids=Object.keys(S.usel); if(!ids.length) return;
  var cap=action.charAt(0).toUpperCase()+action.slice(1);
  modal({title:cap+' '+ids.length+' user'+(ids.length===1?'':'s')+'?',
    message: action==='delete' ? 'Deletes '+ids.length+' account(s). Every mutation is written to the audit trail with an actor.'
                               : 'Applies "'+action+'" to '+ids.length+' selected account(s).',
    confirmText:cap, danger:(action==='delete'||action==='kill')}).then(function(v){
    if(!v) return;
    var done=0;
    (function step(i){
      if(i>=ids.length){ toast(action+' applied to '+done+'/'+ids.length,'ok'); S.usel={}; loadUsers(); loadAudit(); return; }
      actUser(ids[i],action).then(function(j){ if(j&&j.ok) done++; step(i+1); });
    })(0);
  });
}

    + '<td class="num">'+esc(f(j,'rin')||'—')+'</td><td>'+esc(f(j,'source')||'—')+'</td>'
    + '<td><span class="pill '+jobStateClass(state)+'">'+esc(state)+'</span>'
      + (stk?' <span class="pill bad">STUCK</span>':'')+'</td>'
    + '<td style="min-width:130px"><div class="num" style="font-size:12px">'+n(done)+' / '+n(total)+'</div>'
      + '<div class="bar sm" style="margin-top:5px"><i style="width:'+pct(done,total)+'%"></i></div></td>'
    + '<td class="usub">'+when(f(j,'createdAt','created_at','startedAt','at'))+'</td></tr>';

/* `uobj` lets the Activation and Users pages edit an account they are not
   standing on — otherwise the defaults would come from whoever was opened last. */
function editField(email,action,uobj){
  var u=uobj||(S.user&&S.user.user)||{};
  var planOpts=(S.plans||[]).filter(function(p){ return Number(p.active) || String(p.id)===String(u.plan); })
    .map(function(p){ return {value:p.id, label:p.id+' — quota '+(p.quota==null?'∞':p.quota)+((featList(p.features)||[]).length?' · '+(featList(p.features)||[]).join(', '):'')}; });
  var specs = {
    setPlan: planOpts.length
      ? {title:'Change plan',label:'Plan',options:planOpts,value:u.plan||'free',message:'The plan supplies quota and features. A per-user feature override, if one exists, keeps winning over the new plan.'}
      : {title:'Change plan',label:'Plan id',value:u.plan||'free',placeholder:'free / standard / pro',
         message:'/api/plans is not answering, so this is a free-text id. Check it against the Activation section once that endpoint lands.'},
    setQuota:{title:'Client quota',label:'Maximum registration numbers',type:'number',min:0,value:u.quota==null?1:u.quota,
      message:'Enforced once, on the user. Devices inherit it. A user already over the cap keeps their clients and simply cannot add more.'},
    setValidUntil:{title:'Valid until',label:'Date',type:'date',value:u.validUntil?String(u.validUntil).slice(0,10):'',
      message:'A date in the past makes /session answer allowed:false with reason "expired" — a different answer from "locked", and a different action for the user.'},
    setTags:{title:'Tags',label:'Comma-separated tags',value:(Array.isArray(u.tags)?u.tags.join(', '):(u.tags||''))}
  };
  var sp=specs[action]; if(!sp) return;
  modal({title:sp.title, message:sp.message, confirmText:'Save',
    input:{label:sp.label,type:sp.type,min:sp.min,value:sp.value,placeholder:sp.placeholder,options:sp.options}}).then(function(v){
    if(v===null) return;
    var val = sp.type==='number' ? (parseInt(v,10)||0) : v;
    actUser(email,action,val).then(function(j){ if(j.ok){ toast(sp.title+' saved','ok'); afterUserEdit(email); } });
  });
}
function afterUserEdit(email){
  if(S.section==='user'&&S.userEmail===email) loadUser(email);
  loadUsers(); loadAudit();
  if(S.section==='activation') loadPlans();
}
/* setFeatures carries a JSON array — the shape of the `features TEXT` column.
   Toggling from inherited state creates the override, and says so first, because
   from that moment plan edits stop reaching this account. */
function toggleFeature(email,id){
  var u=(S.user&&S.user.user)||{}, v=featureView(u);
  var base=(v.ovr!=null ? v.ovr : (v.planFeats||[])).slice();
  var i=base.indexOf(id);
  if(i>=0) base.splice(i,1); else base.push(id);
  var send=function(){
    actUser(email,'setFeatures',base).then(function(j){ if(j.ok){ toast('Features saved','ok'); afterUserEdit(email); } });
  };
  if(v.ovr!=null) return send();
  modal({title:'Create a per-user override?',
    message:'This account inherits its features from plan '+(u.plan||'free')+'. Saving here writes an explicit list onto the account, '
          + 'and from then on the plan no longer drives it — including future edits to the plan. Clearing the override restores inheritance.',
    confirmText:'Create override'}).then(function(ok){ if(ok) send(); });
}
function clearOverride(email){
  modal({title:'Clear the feature override?',
    message:'Removes the explicit list from this account so it inherits from its plan again. Sends setFeatures with an empty value.',
    confirmText:'Clear override'}).then(function(ok){
    if(!ok) return;
    actUser(email,'setFeatures',null).then(function(j){ if(j.ok){ toast('Override cleared — inheriting from plan','ok'); afterUserEdit(email); } });
  });
}
function wireCommon(){
  q('#views [data-back]', function(b){ b.onclick=function(){ go(b.getAttribute('data-back')); }; });

    try{ navigator.clipboard.writeText(b.getAttribute('data-copy')); toast('Copied','ok',1100); }catch(err){} }; });
}

function openClient(rin){ S.clientRin=rin; S.client=null; go('client',rin); loadClient(rin); }
function clientAction(action,rin,after){
  if(action==='move'){
    var opts=S.users.map(function(u){ return {value:u.email,label:(u.name||u.email)+' — '+(u.company||'')}; });
    var body = opts.length
      ? modal({title:'Move '+rin, message:'Reassigns ownership of this taxpayer. The move is written to the audit trail with an actor.',
          input:{label:'New owner',options:opts}, confirmText:'Move', danger:true})
      : modal({title:'Move '+rin, message:'Reassigns ownership of this taxpayer.',
          input:{label:'New owner email',placeholder:'name@company.com'}, confirmText:'Move', danger:true});
    body.then(function(v){ if(v) post('/api/client',{rin:rin,action:'move',value:v}).then(function(j){ if(j.ok){ toast('Ownership moved','ok'); if(after) after(); loadAudit(); } }); });
    return;
  }
  var run = function(){ post('/api/client',{rin:rin,action:action}).then(function(j){ if(j.ok){ toast(action==='void'?'RIN voided':'RIN restored','ok'); if(after) after(); loadVoids(); loadAudit(); } }); };
  if(action==='void') confirmDanger('Void '+rin+'?','Blocks this registration number for every account, including registration. Propagates within about 60s.','Void').then(function(v){ if(v) run(); });
  else run();
}

/* GET /api/jobs?state=&user=&rin=&stuck=&page=   GET /api/job?id=
   POST /api/job {id, action:abandon|purge}                        SPEC-017 slice 2 */
var JSTATES = [['','All'],['queued','Queued'],['running','Running'],['merging','Merging'],['done','Done'],['failed','Failed']];

function jobsSorted(){
  /* Newest first regardless of what order the page arrives in. */
  return (S.jobs||[]).slice().sort(function(a,b){
    var ta=Date.parse(f(a,'createdAt','created_at')||jobSeen(a)||'')||0;
    var tb=Date.parse(f(b,'createdAt','created_at')||jobSeen(b)||'')||0;
    return tb-ta;
  });
}
function jobsToolbar(){
  var stk=stuckIds().length;
  return '<div class="toolbar">'
    + '<button class="chip alarm'+(S.jstuck?' on':'')+'" id="jstuck" '
      + 'title="Running or merging, not advanced in '+STUCK_MIN+' minutes">Stuck only'+(stk?' · '+stk:'')+'</button>'
    + '<div class="chips" id="jchips">'+JSTATES.map(function(d){
        return '<button class="chip'+(S.jstate===d[0]?' on':'')+'" data-js="'+d[0]+'">'+d[1]+'</button>'; }).join('')+'</div>'
    + '<input id="juser" class="filt" placeholder="user email…" aria-label="Filter by user" value="'+esc(S.juser)+'">'
    + '<input id="jrin" class="filt mono" placeholder="RIN…" aria-label="Filter by registration number" value="'+esc(S.jrin)+'">'
    + (S.jstuck||S.jstate||S.juser||S.jrin ? '<button class="btn tiny ghost" id="jclear">Clear filters</button>' : '')
    + '<span class="sp"></span><span class="mlabel">'+n(S.jtotal)+' runs</span></div>';
}
function jobProgressCell(j){
  var done=Number(f(j,'done')||0), total=Number(f(j,'total')||0), failed=Number(f(j,'failed')||0);
  var live=/run|merg/.test(jobState(j));
  return '<div class="num" style="font-size:12px">'+n(done)+'<span class="muted"> / '+n(total)+'</span>'
    + (failed?' <span class="pill bad" style="margin-left:4px">'+n(failed)+' failed</span>':'')+'</div>'
    + '<div class="bar sm'+(live?' live':'')+'" style="margin-top:5px;min-width:96px"><i style="width:'+pct(done,total)+'%"></i></div>';
}

  var head = jobsToolbar();

    + '<div class="big">GET /api/jobs returned <span class="mono">'+esc(S.jobsErr)+'</span></div>'
