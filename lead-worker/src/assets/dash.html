/* ── the plan selector, with `custom` as a first-class choice ──────────────── */
/* `custom` is not a tier and not a plan row: it is the account saying "my numbers
   are written on me". It belongs in this list anyway, because the alternative is
   an admin who has to KNOW that typing the word into the plan field detaches the
   account — and the two moves in and out of it are the two most expensive edits
   on this page, so both are gated by a warning that names the actual numbers. */
function planChoices(cur){
  var out=[], seen={};
  (S.plans||[]).forEach(function(p){
    if(!Number(p.active) && String(p.id)!==cur) return;      /* retired plans: only the one already in use */
    seen[String(p.id)]=1;
    out.push({id:String(p.id), label:String(p.id)
      + ' — '+(p.quota==null?'∞':p.quota)+' clients, '+planDevices(p)+' device'+(planDevices(p)===1?'':'s')
      + (Number(p.active)?'':' · retired')});
  });
  /* No /api/plans (or a plan the table does not know) must never mean "no way back":
     the account's current plan is always selectable, even when nothing describes it. */
  if(cur!=='custom' && !seen[cur]) out.unshift({id:cur, label:cur+(S.plansDone&&!S.plansErr?' — not in the plans table':' — plan details unknown')});
  if(!out.length) ['free','standard','pro'].forEach(function(id){ if(id!==cur) out.push({id:id,label:id+' — plan details unknown'}); });
  return out;
}
function planDevices(p){ var d=numOr(f(p,'deviceQuota','device_quota')); return d==null?1:d; }
function planClients(p){ var c=numOr(p&&p.quota); return c==null?0:c; }
function planPicker(u,v){
  var cur=String(u.plan||'free');
  var opts=planChoices(cur).map(function(o){
    return '<option value="'+esc(o.id)+'"'+(o.id===cur?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('');
  var custom='<option value="custom"'+(cur==='custom'?' selected':'')+'>custom — negotiated on this account, no plan consulted</option>';
  var bar = v.custom
    ? '<div class="srcbar ovr"><span class="pill accent">CUSTOM</span>'
      + '<span style="flex:1;min-width:180px">Detached from the plans table. Its allowances and features are read from the account verbatim — '
      + 'the <span class="mono">MAX(account, plan)</span> rule does <b>not</b> apply here, which is the only way a cap can be negotiated <b>lower</b> than a standard plan. '
      + 'No edit to any plan can reach this account.</span></div>'
    : '<div class="srcbar"><span class="pill muted">ON A PLAN</span>'
      + '<span style="flex:1;min-width:180px">Everything not written on the account itself comes from plan <b>'+esc(cur)+'</b>, '
      + 'and every allowance resolves to <span class="mono">MAX(account, plan)</span> — so moving this account to a bigger plan is never a downgrade by accident.</span></div>';
  return bar
    + '<div class="field" style="margin-bottom:0"><label>Plan</label>'
    + '<select id="uplanpick">'+opts+custom+'</select>'
    + '<div class="usub" style="margin-top:6px">Changing this writes <span class="mono">setPlan</span>. Moving in or out of <b>custom</b> asks first — both directions rewrite what the account gets.</div></div>';
}
/* Everything the two warnings need, in the words the admin is looking at. */
function effLine(u,v){
  var ent=(S.user&&S.user.entitlement)||null;
  var aq=entAllow(ent,u,'quota')||allowance(u,'quota'), ad=entAllow(ent,u,'device')||allowance(u,'device');
  return {
    clients: aq.value==null?'unlimited':String(aq.value),
    devices: ad.value==null?'unlimited':String(ad.value),
    feats: (v.eff&&v.eff.length)?v.eff.join(', '):'none',
    q:aq, d:ad
  };
}
function changePlan(email,next){
  var u=(S.user&&S.user.user)||{}, cur=String(u.plan||'free');
  next=String(next||'');
  if(!next||next===cur){ paint(); return; }
  var v=featureView(u), e=effLine(u,v);
  var apply=function(){ actUser(email,'setPlan',next).then(function(j){ if(j.ok){ toast('Plan set to '+next,'ok'); S.custEdit=null; afterUserEdit(email); } else paint(); }); };

  /* OFF custom. The expensive direction: the negotiated figures stop being the only
     source and go back through MAX(account, plan), so anything negotiated BELOW the
     plan is gone the moment this saves. Say which numbers, and say which survive. */
  if(cur==='custom'){
    var p=planById(next);
    var pc=p?planClients(p):null, pd=p?planDevices(p):null;
    var pf=p?(featList(p.features)||[]):null;
    modal({title:'Move this account off custom to “'+next+'”?',
      message:'Custom means this account’s numbers are written on the account itself: '+e.clients+' clients, '+e.devices+' devices, and the feature list '+e.feats+'. '
        + 'Moving it to “'+next+'” hands it back to the plan and to the MAX(account, plan) rule. '
        + (p ? 'Plan “'+next+'” gives '+pc+' clients, '+pd+' device'+(pd===1?'':'s')+' and '+(pf&&pf.length?pf.join(', '):'no features')+'. ' : 'The plan’s own numbers are not loaded, so what this account will get cannot be shown here. ')
        + 'Every negotiated figure lower than the plan’s is replaced by the plan’s and cannot be recovered from this screen; only a figure larger than the plan’s survives, as a per-account override. '
        + 'Features come from “'+next+'” unless an explicit per-account list is kept. '
        + 'Write the negotiated numbers down now if you may ever need them back.',
      confirmText:'Replace with '+next, danger:true}).then(function(ok){ if(ok) apply(); else paint(); });
    return;
  }

  /* ONTO custom. Detaching is not itself a downgrade — but reading the account
     verbatim can be one, because `quota` and `device_quota` may be blank or smaller
     than the plan was giving. So the switch WRITES today's effective numbers onto
     the account first and flips the plan last: the moment of the change grants
     exactly what it granted a second earlier, and negotiating starts from there. */
  if(next==='custom'){
    modal({title:'Detach this account from the plans table?',
      message:'custom means the account’s own numbers become the only source: no plan is consulted, and the MAX(account, plan) rule stops applying — which is what lets you negotiate a cap LOWER than any plan. '
        + 'So that the switch itself changes nothing, what the account gets today ('+e.clients+' clients, '+e.devices+' devices, features: '+e.feats+') is written onto the account first, and the plan is changed last. '
        + 'Edit those three in the panel that appears. From then on, no edit to plan “'+cur+'” reaches this account.',
      confirmText:'Make custom'}).then(function(ok){
      if(!ok){ paint(); return; }
      seedCustom(email, e.q.value, e.d.value, (v.eff||[]).slice()).then(function(){ apply(); });
    });
    return;
  }
  apply();
}
/* Numbers first, plan last — a failure half-way leaves the account on the plan it
   already had rather than on custom with somebody else's figures. */
function seedCustom(email,clients,devices,feats){
  /* A number the portal could not resolve is NOT written: sending 0 for "unknown"
     would cap the account at nothing in the same click that detached it. */
  var skip=function(){ return Promise.resolve({ok:true}); };
  return (clients==null ? skip() : actUser(email,'setQuota',clients))
    .then(function(){ return devices==null ? skip() : actUser(email,'setDeviceQuota',devices); })
    .then(function(){ return actUser(email,'setFeatures',feats); })
    .then(function(j){
      /* A feature the plan still grants but the catalogue has since deactivated cannot
         be re-granted — the server says so by name. Not fatal, but not silent either. */
      if(j&&!j.ok) toast('Allowances written; the feature list was refused — '+(j.error||'see the catalogue'),'bad',6000);
      return j;
    });
}

/* Only reachable on plan = custom, because on any other plan these three fields
   mean something different (an override that only wins when it is larger). */
function custDraft(u){

function harvestCustom(){
  if(!S.custEdit) return;
  if($('cu_clients')) S.custEdit.clients=$('cu_clients').value.trim();
  if($('cu_devices')) S.custEdit.devices=$('cu_devices').value.trim();

function saveCustom(email){
  harvestCustom();
  var d=S.custEdit; if(!d) return;
  if(d.clients==='' || isNaN(Number(d.clients)) || Number(d.clients)<0){ toast('Client allowance must be 0 or more','bad'); return; }
  if(d.devices!=='' && (isNaN(Number(d.devices)) || Number(d.devices)<0)){ toast('Device allowance must be 0 or more, or blank','bad'); return; }
  actUser(email,'setQuota',Math.trunc(Number(d.clients)))
    .then(function(){ return actUser(email,'setDeviceQuota', d.devices===''?null:Math.trunc(Number(d.devices))); })
    .then(function(){ return actUser(email,'setFeatures', d.features||[]); })
    .then(function(j){
      if(j&&!j.ok) return;                      /* post() has already surfaced the refusal by name */
      toast('Negotiated terms saved','ok'); S.custEdit=null; afterUserEdit(email);
    });
}

  return back + header + totals + '<div class="grid2">'+identity+entitlement+'</div>' + featPanel

/* `uobj` lets the Activation and Users pages edit an account they are not
   standing on — otherwise the defaults would come from whoever was opened last. */
function editField(email,action,uobj){

  var specs = {
    setPlan: planOpts.length
      ? {title:'Change plan',label:'Plan',options:planOpts,value:u.plan||'free',message:'The plan supplies quota and features. A per-user feature override, if one exists, keeps winning over the new plan.'}
      : {title:'Change plan',label:'Plan id',value:u.plan||'free',placeholder:'free / standard / pro',
         message:'/api/plans is not answering, so this is a free-text id. Check it against the Activation section once that endpoint lands.'},
    setQuota:{title:'Client quota',label:'Maximum registration numbers',type:'number',min:0,value:u.quota==null?1:u.quota,
      message:'Enforced once, on the user. Devices inherit it. A user already over the cap keeps their clients and simply cannot add more.'},
    /* The only field on this page where BLANK is a third value: null hands the
       account back to its plan. Zero would mean "no browser may register", which
       is a very different instruction, so the two must not collapse into one. */
    setDeviceQuota:{title:'Device allowance',label:'Maximum browsers — blank to inherit the plan',type:'number',min:0,
      value:(f(u,'deviceQuota','device_quota')==null?'':f(u,'deviceQuota','device_quota')), blankIsNull:true,
      message:'How many browsers this person may register. Blank clears the override and hands the account back to its plan; 0 means no browser may register at all. '
            + 'Effective allowance is MAX(account, plan), so this can only ever raise it — except on a custom account, where it is read verbatim. '
            + 'Enforced in /register and only there: a browser already on record is never refused, and an account already over the cap keeps every device it has.'},
    setValidUntil:{title:'Valid until',label:'Date',type:'date',value:u.validUntil?String(u.validUntil).slice(0,10):'',
      message:'A date in the past makes /session answer allowed:false with reason "expired" — a different answer from "locked", and a different action for the user.'},
    setTags:{title:'Tags',label:'Comma-separated tags',value:(Array.isArray(u.tags)?u.tags.join(', '):(u.tags||''))}
  };
  var sp=specs[action]; if(!sp) return;
  modal({title:sp.title, message:sp.message, confirmText:'Save',
    input:{label:sp.label,type:sp.type,min:sp.min,value:sp.value,placeholder:sp.placeholder,options:sp.options}}).then(function(v){
    if(v===null) return;
    /* An empty number box is "not set", not zero, wherever the field says so — the
       same reading the server gives it. Everywhere else an empty number is still 0. */
    if(sp.blankIsNull && String(v).trim()===''){
      actUser(email,action,null).then(function(j){ if(j.ok){ toast(sp.title+' cleared — inheriting from the plan','ok'); afterUserEdit(email); } });
      return;
    }
    var val = sp.type==='number' ? (parseInt(v,10)||0) : v;
    actUser(email,action,val).then(function(j){ if(j.ok){ toast(sp.title+' saved','ok'); afterUserEdit(email); } });
  });
}
function afterUserEdit(email){
  if(S.section==='user'&&S.userEmail===email) loadUser(email);
  loadUsers(); loadAudit();

}
/* setFeatures carries a JSON array — the shape of the `features TEXT` column.
   Toggling from inherited state creates the override, and says so first, because
   from that moment plan edits stop reaching this account. */
function toggleFeature(email,id){
  var u=(S.user&&S.user.user)||{}, v=featureView(u);
  var base=(v.ovr!=null ? v.ovr : (v.planFeats||[])).slice();
  var i=base.indexOf(id);
  if(i>=0) base.splice(i,1); else base.push(id);
  var send=function(){
    actUser(email,'setFeatures',base).then(function(j){ if(j.ok){ toast('Features saved','ok'); S.custEdit=null; afterUserEdit(email); } });
  };
  /* On a custom account there is no override to create — this list IS the account's
     entitlement, so the "you are detaching from the plan" warning would be a lie. */
  if(v.custom || v.ovr!=null) return send();
  modal({title:'Create a per-user override?',
    message:'This account inherits its features from plan '+(u.plan||'free')+'. Saving here writes an explicit list onto the account, '
          + 'and from then on the plan no longer drives it — including future edits to the plan. Clearing the override restores inheritance.',
    confirmText:'Create override'}).then(function(ok){ if(ok) send(); });
}
function clearOverride(email){
  modal({title:'Clear the feature override?',
    message:'Removes the explicit list from this account so it inherits from its plan again. Sends setFeatures with an empty value.',
    confirmText:'Clear override'}).then(function(ok){
    if(!ok) return;
    actUser(email,'setFeatures',null).then(function(j){ if(j.ok){ toast('Override cleared — inheriting from plan','ok'); afterUserEdit(email); } });
  });
}

  if(S.jobsErr) return head + '<div class="empty"><span class="mlabel">Export runs</span>'
    + '<div class="big">GET /api/jobs returned <span class="mono">'+esc(S.jobsErr)+'</span></div>'
    + 'The <span class="mono">jobs</span> and <span class="mono">job_chunks</span> tables already exist from SPEC-016; slice 2&#39;s backend half is what exposes them here. '
    + 'Until then a user&#39;s runs are still visible on their own page.</div>';
  var rows = jobsSorted();
  if(!rows.length) return head + '<div class="empty"><span class="mlabel">Export runs</span>'
    + '<div class="big">'+(S.jstuck?'Nothing is wedged':'No run matches')+'</div>'
    + (S.jstuck ? 'No run in <span class="mono">running</span> or <span class="mono">merging</span> has gone quiet for '+STUCK_MIN+' minutes. That is the answer to &ldquo;is anything stuck&rdquo;.'
                : 'Every export an extension starts is recorded here the moment it plans its first chunk.')+'</div>';

  var body = rows.map(function(j){
    var id=jobId(j), stk=isStuck(j), st=jobState(j)||'—';
    var e=esc(id);
    return '<tr class="click'+(stk?' wedged':'')+'" data-jopen="'+e+'">'
      + '<td><div class="uname">'+esc(f(j,'user','user_email')||'—')+'</div>'
        + '<div class="usub mono">'+esc(id.slice(0,18))+'</div></td>'
      + '<td class="num"><b>'+esc(f(j,'rin')||'—')+'</b></td>'
      + '<td>'+esc(f(j,'source')||'—')
        + '<div class="usub mono">'+esc([f(j,'dateField','date_field'),f(j,'dir')].filter(Boolean).join(' · ')||'')+'</div></td>'
      + '<td class="usub num nowrap">'+dayRange(f(j,'from'),f(j,'to'))+'</td>'
      + '<td><span class="pill '+jobStateClass(st)+'">'+esc(st)+'</span>'
        + (stk?'<div style="margin-top:4px"><span class="pill bad">STUCK</span></div>':'')+'</td>'
      + '<td style="min-width:140px">'+jobProgressCell(j)+'</td>'
      + '<td class="num">'+n(f(j,'rows'))+'</td>'
      + '<td class="usub">'+when(jobSeen(j))+'</td>'
      + '<td><div class="act">'
        + '<button class="btn tiny" data-jopen2="'+e+'">Open</button>'
        + (/run|merg|queue|wait/.test(st) ? '<button class="btn tiny danger" data-ja="abandon" data-j="'+e+'">Abandon</button>' : '')
        + '<button class="btn tiny danger" data-ja="purge" data-j="'+e+'">Purge</button>'
        + '</div></td></tr>';
  }).join('');

  return head
    + '<div class="tablewrap"><table class="wide"><thead><tr>'
    + '<th>User / run</th><th>Client TRN</th><th>Source</th><th>Range</th><th>State</th>'
    + '<th>Progress</th><th>Rows</th><th>Last update</th><th></th>'
    + '</tr></thead><tbody>'+body+'</tbody></table></div>'
    + pager('j',S.jpage,S.jtotal);
};

  q('#jchips [data-js]', function(b){ b.onclick=function(){ S.jstate=b.getAttribute('data-js'); S.jpage=1; loadJobs(); }; });
  if($('jclear')) $('jclear').onclick=function(){ S.jstuck=0; S.jstate=''; S.juser=''; S.jrin=''; S.jpage=1; loadJobs(); };
  ['juser','jrin'].forEach(function(id){
    var el=$(id); if(!el) return;
    el.oninput=function(){ S[id]=el.value; S.jpage=1;      /* state key === input id */
      clearTimeout(WIRE['_'+id]); WIRE['_'+id]=setTimeout(loadJobs,260); };
    el.onkeydown=function(e){ if(e.key==='Enter'){ clearTimeout(WIRE['_'+id]); loadJobs(); } };
  });
  q('#views [data-pg]', function(b){ b.onclick=function(){
    var d=b.getAttribute('data-pg').split(':')[1];
    S.jpage = d==='next' ? S.jpage+1 : Math.max(1,S.jpage-1); loadJobs(); }; });
  q('#views tr.click[data-jopen]', function(tr){ tr.onclick=function(e){ if(e.target.closest('button,a,input')) return; openJob(tr.getAttribute('data-jopen')); }; });

function openJob(id){ if(!id) return; S.jobId=id; S.job=null; go('job',id); loadJob(id); }

/* Both actions are destructive in different ways, so both say which one they are.
   Purge is the one an admin can regret: it drops the artefact that answers
   "why did this export fail" and there is no way to rebuild it. */
function jobAction(id,action,after){
  var short=String(id).slice(0,16);
  var spec = action==='purge'
    ? {title:'Purge the chunk detail of '+short+'?',
       message:'Purge drops the chunk detail — every chunk row with its range, count, state and warning. '
             + 'It keeps the job history: the run stays in this list with its user, client, state, progress and totals. '
             + 'The timeline cannot be rebuilt afterwards, so the next "why did this fail" about this run has no answer.',
       confirmText:'Purge chunk detail', ok:'Chunk detail purged'}
    : {title:'Abandon '+short+'?',
       message:'Marks the run dead so it stops counting as running and stops being reported as stuck. '
             + 'Nothing already exported is removed and the chunk detail is kept — purge is the one that drops that.',
       confirmText:'Abandon run', ok:'Run abandoned'};
  return modal({title:spec.title,message:spec.message,confirmText:spec.confirmText,danger:true}).then(function(v){
    if(!v) return;
    return post('/api/job',{id:id,action:action}).then(function(j){
      if(!j.ok) return;
      toast(spec.ok,'ok');
      loadJobs(); loadDashboard(); loadAudit();
      if(S.section==='job'&&S.jobId===id) loadJob(id);
      if(after) after();
    });
  });
}

/* ── job detail: the chunk timeline ───────────────────────────────────────── */
function chunkClass(c){
  var s=String(c.state||'').toLowerCase();
  if(/fail|error|dead/.test(s)) return 'bad';
  if(/run|merg|busy|active/.test(s)) return 'run';
  if(/done|ok|complete|merged/.test(s)) return c.warn ? 'warn' : 'done';
  if(/wait|pend|queue|plan|todo/.test(s)) return 'wait';
  return c.warn ? 'warn' : 'wait';
}
RENDER.job = function(){
  var back='<button class="back" data-back="jobs">&larr; All runs</button>';
  if(!S.job){
    return back+'<div class="empty"><span class="mlabel">Export run</span><div class="big">'
      + (S.jobErr ? 'GET /api/job returned <span class="mono">'+esc(S.jobErr)+'</span>' : 'Loading '+esc(String(S.jobId).slice(0,18))+'…')
      + '</div></div>';
  }
  var j=S.job.job||{}, chunks=S.job.chunks||[];
  var id=jobId(j)||S.jobId, st=jobState(j)||'—', stk=isStuck(j);
  var done=Number(f(j,'done')||0), total=Number(f(j,'total')||0), failed=Number(f(j,'failed')||0);

  var header = '<div class="dhead"><div style="min-width:0">'
    + '<h2 class="mono" style="font-size:21px">'+esc(id)+' <button class="copy" data-copy="'+esc(id)+'">copy</button></h2>'
    + '<div class="dsub">'+esc(f(j,'source')||'—')+' &middot; '+dayRange(f(j,'from'),f(j,'to'))
      + ' &middot; <a href="#" data-uopen="'+esc(f(j,'user','user_email')||'')+'">'+esc(f(j,'user','user_email')||'unknown user')+'</a>'
      + ' &middot; <a href="#" data-copen="'+esc(f(j,'rin')||'')+'" class="num">'+esc(f(j,'rin')||'—')+'</a></div>'
    + '<div class="pills"><span class="pill '+jobStateClass(st)+'">'+esc(st)+'</span>'
      + (stk?' <span class="pill bad">STUCK — no progress in '+Math.floor((Date.now()-Date.parse(jobSeen(j)))/60000)+'m</span>':'')
      + (failed?' <span class="pill bad">'+n(failed)+' chunk'+(failed===1?'':'s')+' failed</span>':'')
      + '</div></div>'
    + '<div class="acts">'
      + (/run|merg|queue|wait/.test(st)?'<button class="btn danger" data-ja="abandon" data-j="'+esc(id)+'">Abandon run</button>':'')
      + '<button class="btn danger" data-ja="purge" data-j="'+esc(id)+'">Purge chunk detail</button>'
    + '</div></div>';

  var strip = '<div class="strip">'
    + [{k:'Chunks done',v:done+' / '+total, c:failed?'warn':'ok'},
       {k:'Failed',v:failed, c:failed?'bad':null},
       {k:'Rows',v:f(j,'rows')||0, c:'info'},
       {k:'Probes',v:f(j,'probes')||0},
       {k:'Version',v:f(j,'version')||'—', c:'moss'}]
      .map(function(t){
        var zero = typeof t.v!=='string' && !Number(t.v);
        return '<div class="tile'+(t.c&&!zero?' '+t.c:'')+(zero?' zero':'')+'"><div class="v">'
          + (typeof t.v==='string'?esc(t.v):n(t.v))+'</div><div class="k">'+esc(t.k)+'</div></div>'; }).join('')
    + '</div>';

  var facts = '<div class="panel"><div class="eyebrow">The request</div><div class="kv">'
    + '<span class="k">Source</span><span class="v">'+esc(f(j,'source')||'—')+'</span>'
    + '<span class="k">Date field</span><span class="v mono">'+esc(f(j,'dateField','date_field')||'—')+'</span>'
    + '<span class="k">Direction</span><span class="v mono">'+esc(f(j,'dir')||'—')+'</span>'
    + '<span class="k">Range</span><span class="v num">'+dayRange(f(j,'from'),f(j,'to'))+'</span>'
    + '<span class="k">Started</span><span class="v">'+cairo(f(j,'createdAt','created_at'))+' <span class="usub">'+esc(rel(f(j,'createdAt','created_at'))||'')+'</span></span>'
    + '<span class="k">Last update</span><span class="v">'+cairo(jobSeen(j))+' <span class="usub">'+esc(rel(jobSeen(j))||'')+'</span></span>'
    + '</div>'
    + (stk ? '<div class="callout bad" style="margin-top:14px"><span class="cl">wedged</span><span class="cb">'
        + 'This run is in <span class="mono">'+esc(st)+'</span> and has not advanced in over '+STUCK_MIN+' minutes. '
        + 'The chunk below still in <span class="mono">running</span> is where it stopped. Abandon releases it.</span></div>' : '')
    + '</div>';

  var progress = '<div class="panel"><div class="eyebrow">Progress</div>'
    + '<div class="runrow" style="border:none;padding-top:0">'
    + '<div><div class="who">'+n(done)+' of '+n(total)+' chunks</div>'
      + '<div class="meta">'+n(f(j,'rows'))+' rows &middot; '+n(failed)+' failed &middot; '+esc(rel(jobSeen(j))||'')+'</div></div>'
    + '<div style="text-align:right"><div class="cnt">'+pct(done,total)+'<small>%</small></div></div>'
    + '<div class="bar'+(/run|merg/.test(st)?' live':'')+'"><i style="width:'+pct(done,total)+'%"></i></div></div></div>';

  /* The purged case is a first-class state, not an empty table. The contract has
     no `purged` flag, so this reads one if the backend sends one and otherwise
     infers it: a job that planned N chunks and reports none is a job whose detail
     was dropped. Both readings are labelled honestly. */
  var flagged = !!f(j,'purged','chunksPurged','chunks_purged');
  var timeline;
  if(!chunks.length && (flagged || total>0)){
    timeline = '<div class="panel"><div class="eyebrow">Chunk timeline</div>'
      + '<div class="callout info"><span class="cl">purged</span><span class="cb">'
      + '<b>The chunk detail for this run was dropped.</b> '
      + (flagged ? 'The server reports it as purged. ' : 'The run planned <b>'+n(total)+'</b> chunks and returned none, which is what a purge leaves behind. ')
      + 'What survives is the header above: user, client, source, range, state, '+n(done)+'/'+n(total)+' chunks, '+n(f(j,'rows'))+' rows. '
      + 'Per-chunk ranges, counts and warnings cannot be recovered.'
      + '<div class="ref">purge keeps the job history &middot; it drops only the chunk rows</div></span></div></div>';
  } else if(!chunks.length){
    timeline = '<div class="panel"><div class="eyebrow">Chunk timeline</div>'
      + '<div class="callout warn"><span class="cl">none</span><span class="cb">'
      + 'This run never recorded a chunk. It stopped before planning finished — a rejected date range, a failed probe, '
      + 'or an abandon while queued. The state above (<span class="mono">'+esc(st)+'</span>) is the whole story.</span></div></div>';
  } else {
    var bad=0, warned=0;
    chunks.forEach(function(c){ var k=chunkClass(c); if(k==='bad') bad++; if(k==='warn'||c.warn) warned++; });
    var ladder = '<div class="ladder">'+chunks.map(function(c,i){
        var k=chunkClass(c), idx=(c.idx!=null?c.idx:i+1);
        return '<button class="ck '+k+'" data-ck="'+esc(String(idx))+'" title="'+esc('#'+idx+'  '+dayRange(c.from,c.to).replace('&rarr;','→')+'  '+(c.state||'')+(c.count!=null?'  · '+c.count+' rows':'')+(c.warn?'  · '+c.warn:''))+'" aria-label="Chunk '+esc(String(idx))+'"></button>';
      }).join('')+'</div>';
    var legendRow = '<div class="legend">'
      + '<span><i style="background:var(--ok)"></i>done</span>'
      + '<span><i style="background:var(--warn)"></i>done with a warning</span>'
      + '<span><i style="background:var(--run)"></i>running</span>'
      + '<span><i style="background:var(--bad)"></i>failed</span>'
      + '<span><i style="background:var(--well);box-shadow:inset 0 0 0 1px var(--line2)"></i>not started</span></div>';

    var rows = chunks.map(function(c,i){
      var k=chunkClass(c), idx=(c.idx!=null?c.idx:i+1);
      var sub = (c.subF||c.subT) ? '<div class="usub num">split '+dayRange(c.subF,c.subT)+'</div>' : '';
      return '<tr class="ch '+(k==='done'?'':k)+'" data-chunk="'+esc(String(idx))+'">'
        + '<td class="num"><b>'+esc(String(idx))+'</b></td>'
        + '<td class="num nowrap">'+dayRange(c.from,c.to)+sub+'</td>'
        + '<td>'+(c.label?'<span class="tag">'+esc(c.label)+'</span>':'<span class="faint">—</span>')+'</td>'
        + '<td class="num">'+(c.count==null?'<span class="faint">—</span>':n(c.count))+'</td>'
        + '<td><span class="pill '+(k==='done'?'':k==='wait'?'muted':k)+'">'+esc(c.state||'—')+'</span></td>'
        + '<td>'+(c.warn?'<div class="warnline">'+esc(c.warn)+'</div>':'<span class="faint">—</span>')+'</td>'
        + '<td class="mono usub">'+esc(String(c.chunkId||'').slice(0,14))+'</td></tr>';
    }).join('');

    timeline = '<div class="panel"><div class="eyebrow">Chunk timeline &middot; <b>'+chunks.length+'</b></div>'
      + '<p class="hint">One square per chunk, in order. This is the artefact that answers &ldquo;the export failed&rdquo; without asking the user for a log — '
      + 'click a square to jump to its row.</p>'
      + ladder + legendRow
      + ((bad||warned) ? '<div class="callout '+(bad?'bad':'warn')+'" style="margin-top:14px"><span class="cl">'+(bad?'failed':'warned')+'</span><span class="cb">'
          + (bad?'<b>'+bad+'</b> chunk'+(bad===1?'':'s')+' failed':'')
          + (bad&&warned?' &middot; ':'')
          + (warned?'<b>'+warned+'</b> completed with a warning':'')
          + '. The rows below carry the reason the server recorded.</span></div>' : '')
      + '</div>'
      + '<div class="tablewrap"><table class="wide"><thead><tr>'
      + '<th style="width:52px">#</th><th>Range</th><th>Part label</th><th>Count</th><th>State</th><th>Warning</th><th>Chunk id</th>'
      + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  return back + header + strip + '<div class="grid2">'+facts+progress+'</div>' + timeline;
};

/* ═══ CHARTS — inline SVG, no libraries ═══════════════════════════════════ */
function svgBars(data,color){
  if(!data||!data.length) return '<div class="muted" style="padding:14px 0;font-size:13px">No data yet.</div>';
  var w=520,rowH=19,gap=9,pad=4;
  var max=Math.max(1,Math.max.apply(null,data.map(function(d){ return d.value; })));
  var h=data.length*(rowH+gap)+pad*2;
  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMinYMin meet" role="img">';
  data.forEach(function(d,i){
    var y=pad+i*(rowH+gap), bw=Math.max(2,(w-190)*(d.value/max));
    s+='<text x="0" y="'+(y+13)+'" class="cl">'+esc(String(d.label).slice(0,16))+'</text>'
      +'<rect x="130" y="'+y+'" width="'+bw+'" height="'+rowH+'" rx="4" fill="'+(color||'var(--accent)')+'"/>'
      +'<text x="'+(137+bw)+'" y="'+(y+13)+'" class="cv">'+d.value+'</text>';
  });
  return s+'</svg>';
}
function svgCols(data,color){
  if(!data||!data.length) return '<div class="muted" style="padding:14px 0;font-size:13px">No data yet.</div>';
  var w=560,h=160,pad=24,nn=data.length;
  var max=Math.max(1,Math.max.apply(null,data.map(function(d){ return d.value; })));
  var bw=(w-pad*2)/nn;
  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMinYMin meet" role="img">';
  data.forEach(function(d,i){
    var bh=(h-pad*2)*(d.value/max), x=pad+i*bw, y=h-pad-bh;
    s+='<rect x="'+(x+1)+'" y="'+y+'" width="'+Math.max(1,bw-2)+'" height="'+Math.max(1,bh)+'" rx="2" fill="'+(color||'var(--accent)')+'"><title>'+esc(d.label)+': '+d.value+'</title></rect>';
  });
  var step=Math.ceil(nn/6);
  data.forEach(function(d,i){ if(i%step===0){ var x=pad+i*bw; s+='<text x="'+(x+bw/2)+'" y="'+(h-8)+'" text-anchor="middle" class="axis">'+esc(String(d.label).slice(5))+'</text>'; } });
  return s+'</svg>';
}
function svgSplit(parts){
  var total=parts.reduce(function(a,p){ return a+p.value; },0)||1, w=520,h=30,x=0;
  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img">';
  parts.forEach(function(p){ var pw=w*(p.value/total);
    s+='<rect x="'+x+'" y="0" width="'+Math.max(0,pw)+'" height="'+h+'" fill="'+p.color+'"><title>'+esc(p.label)+': '+p.value+'</title></rect>'; x+=pw; });
  return s+'</svg>';
}
function legend(parts){ return '<div class="legend">'+parts.map(function(p){ return '<span><i style="background:'+p.color+'"></i>'+esc(p.label)+': '+p.value+'</span>'; }).join('')+'</div>'; }
function chart(title,hint,inner){ return '<div class="panel chartcard"><div class="eyebrow">'+esc(title)+'</div><p class="hint">'+hint+'</p>'+inner+'</div>'; }

/* GET /api/plans   POST /api/plan (upsert)   POST /api/plan/delete   SPEC-017 slice 3 */
function planUsersOnPage(id){
  var nn=0; (S.users||[]).forEach(function(u){ if(String(u.plan||'')===String(id)) nn++; });
  return nn;
}
/* Toggles, never a text field: a mistyped id does not fail loudly, it silently grants
   nothing. The chips come from the catalogue (SPEC-019) rather than a list in this
   file — that is the whole point of the table. */
function featureChips(sel,attr){
  sel = sel||[];
  return '<div class="chips">'+catalogue().map(function(x){
    var id=String(x.id), on=sel.indexOf(id)>=0, dead=!Number(x.active);
    /* Retired: removable, never newly grantable. Exactly the rule the server applies,
       said before the click rather than as a refusal after it. */
    var tip=(x.name||id)+(x.description?' — '+x.description:'')
      + (dead?' · retired: existing grants keep working, new ones are refused':'')
      + (isWired(id)?'':' · NOT WIRED: nothing in the extension asks for this id yet');
    return '<button type="button" class="chip'+(on?' on':'')+'"'+(dead&&!on?' disabled':'')+' '+attr+'="'+esc(id)+'" title="'+esc(tip)+'">'
      + esc(id)+(dead?' &middot;retired':'')+'</button>';
  }).join('')
  + sel.filter(function(id){ return !featureKnown(id); }).map(function(id){
      return '<button type="button" class="chip on" '+attr+'="'+esc(id)+'" title="Not in the catalogue — nothing gates on it, and the server will refuse it on the next save">'+esc(id)+' ?</button>';
    }).join('')
  + '</div>'
  + (catalogueFallback()
      ? '<div class="usub" style="margin-top:6px">'
        + (S.featsErr ? '<span class="mono">/api/features</span> answered <span class="mono">'+esc(S.featsErr)+'</span> — showing the two ids <span class="mono">ensureSchema()</span> seeds.'
                      : 'The catalogue is empty. Add a feature under <b>Features</b> before anything can be granted.')
        + '</div>' : '');
}
function planEditor(){
  var p=S.planEdit; if(!p) return '';
  var isNew=!p.existing;
  return '<div class="planed">'
    + '<div class="eyebrow">'+(isNew?'New plan':'Editing <b>'+esc(p.id)+'</b>')+'</div>'
    + '<div class="grid2">'
      + '<div class="field"><label>Plan id — sent to the extension</label>'
        + '<input id="pl_id" class="mono" placeholder="e.g. standard" value="'+esc(p.id||'')+'"'+(isNew?'':' disabled')+'></div>'
      + '<div class="field"><label>Display name</label><input id="pl_name" placeholder="e.g. Standard" value="'+esc(p.name||'')+'"></div>'
    + '</div><div class="grid2">'
      + '<div class="field"><label>Client quota — registration numbers</label><input id="pl_quota" type="number" min="0" value="'+esc(p.quota==null?1:p.quota)+'"></div>'
      /* SPEC-019's other half. Left out of a save this field would have been reset to
         one device for every account on the plan, which is why the server treats an
         ABSENT deviceQuota as "leave it alone" — this box always sends a number. */

  return plansPanel + '<div class="grid2">'+vocab+expiry+'</div>';
};

    S.uplan=b.getAttribute('data-goplan'); S.ustatus='all'; S.upage=1; go('users'); loadUsers(); }; });
  q('#views [data-pedit]', function(b){ b.onclick=function(){
    var p=planById(b.getAttribute('data-pedit')); if(!p) return;
    S.planEdit={id:p.id,name:p.name||'',quota:(p.quota==null?1:p.quota),deviceQuota:planDevices(p),
                features:(featList(p.features)||[]),
                price:p.price||'',active:Number(p.active)?1:0,existing:true};

  /* Feature chips repaint, so harvest the half-typed fields first — a toggle must
     not eat the name someone is in the middle of writing. */
  q('#views [data-pf]', function(b){ b.onclick=function(){
    harvestPlan();
    var id=b.getAttribute('data-pf'), fs=S.planEdit.features||[], i=fs.indexOf(id);
    if(i>=0) fs.splice(i,1); else fs.push(id);
    S.planEdit.features=fs; paint(); }; });
  if($('pl_cancel')) $('pl_cancel').onclick=function(){ S.planEdit=null; paint(); };
  if($('pl_active')) $('pl_active').onchange=function(){ harvestPlan(); S.planEdit.active=$('pl_active').checked?1:0; paint(); };
  if($('pl_save')) $('pl_save').onclick=savePlan;
  q('#views tr.click[data-uopen]', function(tr){ tr.onclick=function(e){ if(e.target.closest('button,a,input')) return; openUser(tr.getAttribute('data-uopen')); }; });
  q('#views [data-go2]', function(b){ b.onclick=function(){ go(b.getAttribute('data-go2')); }; });

function harvestPlan(){
  if(!S.planEdit) return;
  if($('pl_id')&&!S.planEdit.existing) S.planEdit.id=$('pl_id').value.trim();
  if($('pl_name'))  S.planEdit.name=$('pl_name').value;
  if($('pl_quota')){ var qv=$('pl_quota').value; S.planEdit.quota = qv===''?'':parseInt(qv,10); }
  if($('pl_devq')){ var dv=$('pl_devq').value; S.planEdit.deviceQuota = dv===''?'':parseInt(dv,10); }
  if($('pl_price')) S.planEdit.price=$('pl_price').value;
  if($('pl_active'))S.planEdit.active=$('pl_active').checked?1:0;
}
function savePlan(){
  harvestPlan();
  var p=S.planEdit; if(!p) return;
  p.err='';
  if(!p.id){ toast('A plan needs an id','bad'); return; }
  if(!/^[a-z0-9][a-z0-9_-]*$/.test(p.id)){ toast('Plan id: lowercase letters, digits, dash, underscore','bad'); return; }
  /* The server refuses this id too, but saying it here means the admin learns WHY
     before losing the form: `custom` already means "written on the account". */
  if(p.id==='custom'){
    p.err='“custom” is a reserved account type, not a plan. Set an account’s plan to custom on its own page to give it negotiated numbers; a plan row by that name would give one word two meanings.';
    paint(); return;
  }
  if(p.quota===''||p.quota==null||isNaN(Number(p.quota))||Number(p.quota)<0){ toast('Client quota must be 0 or more','bad'); return; }
  if(p.deviceQuota===''||p.deviceQuota==null||isNaN(Number(p.deviceQuota))||Number(p.deviceQuota)<0){ toast('Device quota must be 0 or more','bad'); return; }
  post('/api/plan',{id:p.id,name:p.name||p.id,quota:Number(p.quota),deviceQuota:Number(p.deviceQuota),
                    features:p.features||[],price:p.price||'',active:p.active?1:0}, true)
    .then(function(j){
      /* A grant refusal (400) names the ids: unknown ones are typos, inactive ones are
         retired and can no longer be sold. Rendered in the editor, not thrown into a
         toast that disappears before the admin can fix the chips. */
      if(!j.ok){
        p.err=(j.error||'The server refused this plan.')
          + (j.unknown&&j.unknown.length?' · not in the catalogue: '+j.unknown.join(', '):'')
          + (j.inactive&&j.inactive.length?' · retired: '+j.inactive.join(', '):'');
        paint(); return;
      }
      toast(p.existing?'Plan saved':'Plan created','ok');
      S.planEdit=null; S.planRefused=null; loadPlans(); loadUsers(); loadAudit(); paint(); });
}
/* The 409 is the interesting answer here, not the failure. It is the only place
   the server tells an admin that a plan is load-bearing, so it is rendered in
   full instead of being flattened into a toast. */
function planDelete(id){
  confirmDanger('Delete plan '+id+'?',
    'Removes the plan definition. The server refuses while any account references it — that refusal is shown here with its reason, not swallowed.',
    'Delete plan').then(function(v){
    if(!v) return;
    if(DEMO){   /* show the refusal the real server would send */
      S.planRefused={id:id,error:'plan_in_use',status:409,count:planUsersOnPage(id)};
      toast('Demo — this is the refusal the server would send','n'); paint(); return;
    }
    post('/api/plan/delete',{id:id},true).then(function(j){
      if(j.ok){ toast('Plan deleted','ok'); S.planRefused=null; loadPlans(); loadAudit(); return; }
      var cnt=f(j,'count','users','userCount','inUse','in_use');
      S.planRefused={id:id, error:j.error||'refused', status:j._status, count:(typeof cnt==='number'?cnt:null)};
      toast('Plan '+id+' was not deleted','bad');
      paint();
    });
  });
}

/* ═══ FEATURE CATALOGUE ═══════════════════════════════════════════════════ */
/* GET /api/features   POST /api/feature (upsert)   POST /api/feature/delete
   SPEC-019. Features stop being a vocabulary hard-coded in this file and become
   rows an admin owns. The one thing a row CANNOT do is gate anything by itself,
   and this section says so before anybody creates one — otherwise the first new
   feature is sold on a Tuesday and appears to do nothing forever. */
function featEditor(){
  var x=S.featEdit; if(!x) return '';
  var isNew=!x.existing;
  return '<div class="planed">'
    + '<div class="eyebrow">'+(isNew?'New feature':'Editing <b>'+esc(x.id)+'</b>')+'</div>'
    + '<div class="grid2">'
      + '<div class="field"><label>Id — written verbatim into every grant</label>'
        + '<input id="ft_id" class="mono" placeholder="e.g. bulk-pdf" value="'+esc(x.id||'')+'"'+(isNew?'':' disabled')+'>'
        + '<div class="usub">'+(isNew
            ? 'Lowercase slug. It is the primary key and can never be changed: a grant stores this string, so renaming it would revoke the feature everywhere it had been sold.'
            : 'Immutable. Renaming would revoke this feature on every plan and account holding it — create a new id and grant that instead.')+'</div></div>'
      + '<div class="field"><label>Name — shown in the portal</label>'
        + '<input id="ft_name" placeholder="e.g. Bulk PDF download" value="'+esc(x.name||'')+'"></div>'
    + '</div>'
    + '<div class="field"><label>Description — what the customer gets</label>'
      + '<textarea id="ft_desc" maxlength="400" placeholder="One sentence a salesperson could read out.">'+esc(x.description||'')+'</textarea></div>'
    + '<div class="field"><label>Availability</label>'
      + '<label class="switch"><input type="checkbox" id="ft_active"'+(Number(x.active)?' checked':'')+'><span class="swtrack"></span>'
      + '<span style="font-size:13px" class="'+(Number(x.active)?'':'muted')+'">'
      + (Number(x.active)?'Active — can be granted to plans and accounts':'Retired — everyone holding it keeps it; nobody new can be given it')+'</span></label>'
      + '<div class="usub">Retiring is the safe opposite of deleting: it stops new grants without taking anything away from anybody.</div></div>'
    + (x.err ? '<div class="callout bad"><span class="cl">refused</span><span class="cb">'+esc(x.err)+'</span></div>' : '')
    + '<div class="inline" style="margin-top:6px"><button class="btn primary" id="ft_save">'+(isNew?'Create feature':'Save feature')+'</button>'
      + '<button class="btn ghost" id="ft_cancel">Cancel</button>'
      + '<span class="mlabel">POST /api/feature</span></div></div>';
}
RENDER.features = function(){
  var cat=catalogue();

  /* The honest limit, first and unmissable. A catalogue row is a price-list entry;
     the gate is a line in the extension. Anyone creating a feature here has to read
     this before they read anything else. */
  var wire = '<div class="wirebar"><span class="cl">read first</span><span>'
    + 'A row here is a <b>sellable label, not a gate</b>. A feature only does something when a line in the extension asks for its id by name — '
    + '<span class="mono">auto-reject</span> opens the Rejection tab because <span class="mono">src/ui/flow.js</span> asks for it. '

  var body;

      return '<div class="feat'+(live?'':' dead')+(wired?' wired':'')+'">'

                 :'<span class="pill warn" title="Nothing in the extension asks for this id — granting it has no visible effect yet">not wired</span>')
          + '</div>'
        + '<div class="fd">'+esc(x.name||id)+(x.description?' — '+esc(x.description):'')+'</div>'
        + '<div class="fw">'+(wired ? WIRED[id]
            : '<b>Not wired.</b> Nothing in the extension checks this id, so granting it is a line on an invoice and nothing more until someone adds the check.')+'</div>'

  return '<div class="panel">'+wire

  if($('ft_active')) $('ft_active').onchange=function(){ harvestFeature(); S.featEdit.active=$('ft_active').checked?1:0; paint(); };
  if($('ft_save')) $('ft_save').onclick=saveFeature;
  q('#views [data-ftedit]', function(b){ b.onclick=function(){
    var x=featureKnown(b.getAttribute('data-ftedit')); if(!x) return;
    S.featEdit={id:String(x.id),name:x.name||'',description:x.description||'',active:Number(x.active)?1:0,existing:true};
    paint(); }; });
  q('#views [data-ftoff]', function(b){ b.onclick=function(){ setFeatureActive(b.getAttribute('data-ftoff'),false); }; });
  q('#views [data-fton]', function(b){ b.onclick=function(){ setFeatureActive(b.getAttribute('data-fton'),true); }; });
  q('#views [data-ftdel]', function(b){ b.onclick=function(){ featureDelete(b.getAttribute('data-ftdel')); }; });
};
function harvestFeature(){
  if(!S.featEdit) return;
  if($('ft_id')&&!S.featEdit.existing) S.featEdit.id=$('ft_id').value.trim().toLowerCase();
  if($('ft_name')) S.featEdit.name=$('ft_name').value;
  if($('ft_desc')) S.featEdit.description=$('ft_desc').value;
  if($('ft_active')) S.featEdit.active=$('ft_active').checked?1:0;
}
function saveFeature(){
  harvestFeature();
  var x=S.featEdit; if(!x) return;
  x.err='';
  if(!x.id){ toast('A feature needs an id','bad'); return; }
  /* The server slugs anything it is given; refusing here instead means the admin sees
     the id they will actually be stuck with, before it becomes a primary key. */
  if(!/^[a-z0-9][a-z0-9._-]*$/.test(x.id)){ toast('Id: lowercase letters, digits, dot, dash, underscore','bad'); return; }
  if(!x.existing && featureKnown(x.id)){ x.err='“'+x.id+'” is already in the catalogue. Edit that row instead — creating it again would overwrite its name and description.'; paint(); return; }
  post('/api/feature',{id:x.id,name:x.name||x.id,description:x.description||'',active:x.active?1:0}, true)
    .then(function(j){
      if(!j.ok){ x.err=j.error||'The server refused this feature.'; paint(); return; }
      toast(x.existing?'Feature saved':'Feature created — a label until the extension asks for it','ok',4200);
      S.featEdit=null; loadFeatures(); loadPlans(); loadAudit(); paint(); });
}
function setFeatureActive(id,on){
  var x=featureKnown(id); if(!x) return;
  var go2=function(){
    post('/api/feature',{id:id,name:x.name||id,description:x.description||'',active:on?1:0})
      .then(function(j){ if(j.ok){ toast(on?'Reactivated':'Retired — existing grants keep working','ok'); loadFeatures(); loadAudit(); } });
  };
  if(on) return go2();
  var use=featureUse(id);
  modal({title:'Retire “'+id+'”?',
    message:'Nothing is taken away: every plan and account holding this feature keeps it, and it keeps working exactly as it does now'
      + (use.plans.length?' (still granted by '+use.plans.join(', ')+')':'')
      + '. Retiring only stops NEW grants — setFeatures will refuse this id from now on. Reactivating is one click.',
    confirmText:'Retire'}).then(function(ok){ if(ok) go2(); });
}
/* The 409 is the interesting answer, exactly as it is for a plan: it is the only
   place the server says a feature is load-bearing, and it names both counts because
   they need different fixes — a plan is one edit, N accounts are N. */
function featureDelete(id){
  var use=featureUse(id);
  confirmDanger('Delete “'+id+'” from the catalogue?',
    'Deleting removes the row entirely. Any plan or account still granting this id would be left pointing at a feature that no longer exists, so the server refuses while any grant remains — and names how many. '
    + (use.plans.length||use.users ? 'The loaded pages already show '+use.plans.length+' plan(s) and '+use.users+' account(s) granting it, so this will almost certainly be refused. ' : '')
    + 'Retiring is the reversible move: it stops new grants without taking anything away.',
    'Delete').then(function(v){
    if(!v) return;
    if(DEMO){ S.featRefused={id:id,plans:use.plans.length,users:use.users}; toast('Demo — this is the refusal the server would send','n'); paint(); return; }
    post('/api/feature/delete',{id:id},true).then(function(j){
      if(j.ok){ toast('Feature deleted','ok'); S.featRefused=null; loadFeatures(); loadPlans(); loadAudit(); return; }
      S.featRefused={id:id, plans:(typeof j.plans==='number'?j.plans:null), users:(typeof j.users==='number'?j.users:null), error:j.error||'refused'};
      toast(id+' was not deleted','bad');
      paint();
    });
  });
}

/* ═══ BUGS ════════════════════════════════════════════════════════════════ */
/* SPEC-017 slice 4. The old list was a flat KV scan — a message, a name, a device
   id — which answers "somebody is unhappy" and nothing else. This one asks the
   server, which joins each report to the PERSON who filed it, the BROWSER it came
   from, and where it can be worked out, the RUN that was in flight when they
   pressed the button. The last join is the one that has to be handled carefully:
   the server grades it `exact` or `inferred`, and `inferred` is a guess. The
   portal repeats that grading everywhere the run appears and never launders it. */

/* First line only, for a list row: a report is prose and the table is a scan. */
function firstLine(s,max){
  var raw=String(s==null?'':s);
  var t=raw.split(/\r?\n/)[0].trim();
  max=max||118;
  return t.length>max ? t.slice(0,max-1)+'…' : t;
}
function moreLines(s){
  var lines=String(s==null?'':s).split(/\r?\n/).filter(function(l){ return l.trim(); });
  return lines.length>1 ? lines.length-1 : 0;
}
/* Solid = the report identified this run. Dashed with a question mark = the server
   offered its best guess and said so. `none` is not a failure — most reports are
   not about an export at all. */
function jobMatchPill(m){
  m=String(m||'none');
  if(m==='exact')    return '<span class="pill ok">run matched</span>';
  if(m==='inferred') return '<span class="pill warn guess">run guessed</span>';
  return '<span class="pill muted">no run</span>';
}
function bugStatusPill(g){
  return (g.status||'open')==='open'
    ? '<span class="pill warn">open</span>'
    : '<span class="pill">resolved</span>';
}

RENDER.bugs = function(){
  var head = '<div class="toolbar">'
    + '<input id="bsearch" class="search" placeholder="Search name, email, TRN, message, device, version…" aria-label="Search bug reports" value="'+esc(S.bq)+'">'
    + '<div class="chips" id="bchips">'+[['all','All'],['open','Open'],['resolved','Resolved']].map(function(d){
        return '<button class="chip'+(S.bfilter===d[0]?' on':'')+'" data-bf="'+d[0]+'">'+d[1]+'</button>'; }).join('')+'</div>'
    + (S.bopen ? '<span class="pill warn">'+n(S.bopen)+' open</span>' : '<span class="pill">nothing open</span>')
    + '<span class="sp"></span><button class="btn" id="bexport">Bugs CSV</button></div>';

  /* An unjoined answer is the legacy KV reader, not this endpoint. Say which one
     is talking rather than showing empty join columns as if nobody matched. */
  var degraded = (!S.bjoined && S.bugs.length)
    ? '<div class="callout warn"><span class="cl">unjoined</span><span class="cb">'
      + '<b>These rows came back from the legacy reader.</b> The portal&rsquo;s own list needs a D1 binding to resolve each report to its user, its browser and its run; this environment has none, so those columns are blank because nothing was looked up — not because nothing matched. '
      + 'Status, search and paging are being done here in the page rather than by the server.</span></div>'
    : '';

  if(S.bugsErr){
    return head + '<div class="empty"><span class="mlabel">Bug reports</span>'
      + '<div class="big">GET /api/bugs returned <span class="mono">'+esc(S.bugsErr)+'</span></div>'
      + 'Reports live in KV and survive this — the list is what is unavailable, not the records.</div>';
  }
  /* The legacy reader returns everything, unfiltered and unpaged. Do the filtering
     here rather than let a chip that says "Open" sit above a list that is not —
     the callout above promises this, and a promise the page does not keep is worse
     than the missing binding it is explaining. */
  var list=S.bugs;
  if(!S.bjoined){
    var lq=String(S.bq||'').toLowerCase().trim();
    list=list.filter(function(g){ return S.bfilter==='all' || (g.status||'open')===S.bfilter; })
      .filter(function(g){ return !lq || [g.name,g.email,g.rin,g.message,g.deviceId,(g.diag&&g.diag.version)].join(' ').toLowerCase().indexOf(lq)>=0; });
  }

  if(!list.length){
    return head + degraded + '<div class="empty"><span class="mlabel">Bug reports</span><div class="big">'
      + (S.bq||S.bfilter!=='all' ? 'Nothing matches that filter' : 'Nothing reported')+'</div>'
      + (S.bq||S.bfilter!=='all'
        ? 'The search runs on name, email, TRN, message, device id and extension version.'
        : 'Reports raised from inside the extension land here with their diagnostics, and are joined to the person, the browser and the run they came out of.')+'</div>';
  }

  /* "Nothing matched" and "nothing was looked up" are different answers, and only
     one of them is a finding. When the joins did not run, the two columns that
     depend on them say so instead of reporting the absence as a determination —
     otherwise the legacy reader would quietly tell an operator that a report has no
     account and no run, which is a statement it is in no position to make. */
  var rows = list.map(function(g){
    var u=g.user||null, extra=moreLines(g.message);
    var company = (u&&u.company) || '';
    return '<tr class="click" data-bopen="'+esc(g.id)+'">'
      + '<td class="usub nowrap">'+when(g.at)+'</td>'
      + '<td><div class="uname">'+esc(g.name||(u&&u.name)||'—')+'</div>'
        + '<div class="usub mono">'+esc(g.email||(u&&u.email)||'no address on the report')+'</div>'
        + (company?'<div class="usub">'+esc(company)+'</div>':'')
        + (u?'':'<div class="usub"><span class="faint">'+(S.bjoined?'no account matched':'not looked up')+'</span></div>')+'</td>'
      + '<td class="num">'+esc(g.rin||'—')+'</td>'
      + '<td class="msg">'+esc(firstLine(g.message)||'(no message)')
        + (extra?'<div class="usub" style="margin-top:4px">+'+extra+' more line'+(extra===1?'':'s')+'</div>':'')
        + (g.note?'<div class="usub" style="margin-top:4px"><span class="pill muted">noted</span></div>':'')+'</td>'
      + '<td>'+(S.bjoined
          ? jobMatchPill(g.jobMatch)
          : '<span class="pill muted" title="The joins need a D1 binding this environment has not got. Nothing was looked up, so nothing can be said about a run.">not looked up</span>')
        + (g.job?'<div class="usub mono" style="margin-top:4px">'+esc(String(g.job.jobId||'').slice(0,14))+'</div>':'')+'</td>'
      + '<td>'+bugStatusPill(g)+'</td>'
      + '<td><div class="act">'
        + ((g.status||'open')==='open'
            ? '<button class="btn tiny" data-bact="resolve" data-b="'+esc(g.id)+'">Resolve</button>'
            : '<button class="btn tiny" data-bact="reopen" data-b="'+esc(g.id)+'">Reopen</button>')
        + '<button class="btn tiny danger" data-bact="delete" data-b="'+esc(g.id)+'">Delete</button>'
      + '</div></td></tr>';
  }).join('');

  return head + degraded
    + '<div class="tablewrap"><table class="wide"><thead><tr>'
    + '<th style="width:118px">When</th><th style="width:210px">Reporter</th><th style="width:110px">TRN</th>'
    + '<th>Report</th><th style="width:132px">Run</th><th style="width:98px">Status</th><th style="width:176px"></th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
    + (S.bjoined ? pagerN('b', S.bpage, S.bpages, S.btotal, 'reports') : '');
};
WIRE.bugs = function(){

  if(si){

function wireBugActions(){

    e.stopPropagation(); bugAction(b.getAttribute('data-b'), b.getAttribute('data-bact')); }; });
}
function openBug(id){ if(!id) return; S.bugSel=id; S.bug=null; go('bug',id); loadBug(id); }

/* resolve · reopen · note · delete. Every one of them is audited by the server —
   which the handler these replace did for none of them, so a report could be
   destroyed with no record that it had ever existed. */
function bugAction(id,action){
  if(!id) return Promise.resolve();
  if(action==='delete') return bugDelete(id);
  if(action==='note') return bugNote(id);
  return post('/api/bug',{id:id,action:action}).then(function(j){
    if(!j.ok) return;
    toast(action==='resolve'?'Resolved':'Reopened','ok');
    afterBugChange(id);
  });
}
function afterBugChange(id){
  loadBugs(); loadAudit(); loadAuditPage(); loadDashboard();
  if(S.section==='bug' && S.bugSel===id) loadBug(id);
}
function bugNote(id){
  return modal({
    title:'Note on this report',
    message:'Kept ON the report, where whoever picks it up next will see it. The audit trail records that a note was written and how long it was — never the text: it is free prose about a named person, and the trail lives 180 days and is read by more people than this report is.',
    confirmText:'Save note',
    input:{type:'textarea',label:'Note',placeholder:'e.g. Reproduced on 0.4.1 — it is the merge step, not the fetch.'}
  }).then(function(v){
    v=String(v==null?'':v).trim();
    if(!v) return;
    return post('/api/bug',{id:id,action:'note',value:v}).then(function(j){
      if(!j.ok) return;
      toast('Note saved on the report','ok');
      afterBugChange(id);
    });
  });
}
/* The one action that cannot be taken back. It says so in full: what goes, what
   does not follow it into the trail, and that there is no trash to fish it out of. */
function bugDelete(id){
  return modal({
    title:'Delete report '+String(id).slice(0,22)+'?',
    message:'The report is gone for good. It is not moved to trash and there is no undo — the message, the diagnostics and the log tail the user attached all go with it. '
          + 'The audit trail will record that it was deleted, who deleted it, and which reporter and browser it belonged to. It will NOT record the message: those are the user’s own words about their own tax data, and deleting a report must not copy them somewhere that outlives it.',
    confirmText:'Delete for good', danger:true
  }).then(function(v){
    if(!v) return;
    return post('/api/bug',{id:id,action:'delete'}).then(function(j){
      if(!j.ok) return;
      toast('Report deleted — gone for good','ok');
      if(S.section==='bug' && S.bugSel===id){ S.bug=null; S.bugSel=''; go('bugs'); }
      loadBugs(); loadAudit(); loadAuditPage(); loadDashboard();
    });
  });

/* ═══ BUG DETAIL ══════════════════════════════════════════════════════════ */
/* Clock only — the log tail already sits under a header that carries the date, and
   seconds are what a log is read by. */
function clock(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
  catch(e){ return String(iso).slice(11,19); }
}
/* The run log with the moment of the report drawn INTO it. "What was happening
   when it broke" is a question about the lines either side of one instant, so the
   instant is marked rather than left for the reader to find by timestamp. */
function logTail(ev,atIso){
  var at=Date.parse(atIso||'')||0, marked=false, out='', i, e, t, lv, cls;
  for(i=0;i<ev.length;i++){
    e=ev[i]; t=Date.parse(e.at||'')||0;
    if(at && !marked && t>=at){ out+='<div class="filed">report filed</div>'; marked=true; }
    lv=String(e.level||'info').toLowerCase();
    cls = /err|fail|fatal/.test(lv) ? ' bad' : /warn/.test(lv) ? ' warn' : '';
    out+='<div class="ln'+cls+'"><span class="t">'+esc(clock(e.at))+'</span>'
      + '<span class="lv">'+esc(lv)+'</span>'
      + '<span class="tx">'+(e.kind?'<span class="faint">'+esc(e.kind)+'</span> ':'')+esc(e.text||'')+'</span></div>';
  }
  if(at && !marked) out+='<div class="filed">report filed</div>';
  return '<div class="log">'+out+'</div>';
}
/* The three gradings, written out. `inferred` gets the longest paragraph on this
   page on purpose: it is the one an operator can act on wrongly. */
function matchNote(m){
  if(m==='exact') return {c:'ok', l:'exact', t:
    '<b>This is the run the report is about.</b> The diagnostics the client attached carry the plan summary the user had on screen — source, date range and chunk count — and they identify this run and no other. Treat it as fact.'};
  if(m==='inferred') return {c:'warn guess', l:'inferred', t:
    '<b>This run is a guess, not a fact.</b> The report carried nothing that identified a run, so the server offered the newest export this browser touched within six hours of the report and labelled it <span class="mono">inferred</span>. '
    + 'It may well be the wrong run: a user can file a report about yesterday, or about something that is not an export at all. Check the range and the log below before acting on it, and never quote it back to them as the run that failed.'};
  return {c:'info', l:'none', t:
    '<b>No run is attached to this report.</b> This browser had made no export by the time it was filed. That is the correct answer for most reports — they are about the extension, not about a particular export.'};
}

/* ═══ AUDIT TRAIL ═════════════════════════════════════════════════════════ */
/* Two things this section refuses to blur.
 *
 * 1. WHAT CHANGED. An entry that records only that `setQuota` happened cannot
 *    answer "who set this to 1", which is the only question the trail is ever
 *    opened to answer. `detail.field` with `before` → `after` IS the entry; the
 *    action name is just its heading. Where an entry carries no before/after, the
 *    cell says so rather than dressing the remaining keys up as a change.
 *
 * 2. WHO — and how much that name is worth. `via` records where the actor's name
 *    came from. 'token' is the shared admin bearer secret: it names nobody, and
 *    the trail does not pretend otherwise. 'access' is an address that Cloudflare
 *    Access stamped on the request HEADER. That is a label, not proof — verifying
 *    it means validating the Access JWT against the team's public keys, which this
 *    deployment does not do. So an asserted name is rendered as asserted: dotted,
 *    marked, and never given the green of something checked. Nobody reading this
 *    table should be able to mistake one for the other, and nobody should be able
 *    to quote an asserted name as an established fact. */

function auditVal(v){
  if(v===undefined||v===null||v==='') return '<span class="faint">not set</span>';
  if(v===true) return '<b>on</b>';
  if(v===false) return '<b>off</b>';
  if(Array.isArray(v)) return v.length
    ? v.map(function(x){ return '<span class="tag">'+esc(String(x))+'</span>'; }).join('')
    : '<span class="faint">none</span>';
  if(typeof v==='object') return '<b class="mono">'+esc(JSON.stringify(v))+'</b>';
  return '<b class="mono">'+esc(String(v))+'</b>';
}
/* The detail keys that are NOT the change — who the report belonged to, how many
   rows a migration touched, how long a note was. Context, shown as context. */
function auditCtx(d,skip){
  var out=[], k, v;
  for(k in d){
    if(!Object.prototype.hasOwnProperty.call(d,k)) continue;
    if(skip.indexOf(k)>=0) continue;
    v=d[k];
    if(v===''||v===null||v===undefined) continue;
    out.push('<span>'+esc(k)+' <b>'+esc(v&&typeof v==='object'?JSON.stringify(v):String(v))+'</b></span>');
  }
  return out.length ? '<div class="dctx mono">'+out.join('')+'</div>' : '';
}
function auditDiff(a){
  var d=(a&&a.detail)||{}, has=Object.prototype.hasOwnProperty;
  var hasB=has.call(d,'before'), hasA=has.call(d,'after');
  var ctx=auditCtx(d,['before','after','field']);
  if(!hasB && !hasA){
    /* Said plainly. An entitlement change without both sides is a gap in the
       trail, and a gap that looks like a record is worse than a blank. */
    return ctx
      ? ctx+'<div class="usub" style="margin-top:3px">no before/after on this entry</div>'
      : '<span class="faint">nothing recorded — this entry logged no detail</span>';
  }
  return '<div class="diff">'
    + (d.field?'<span class="fld">'+esc(d.field)+'</span>':'')
    + '<span class="b4">'+auditVal(d.before)+'</span>'
    + '<span class="arw">&rarr;</span>'
    + '<span class="af">'+auditVal(d.after)+'</span>'
    + '</div>' + ctx;
}
function auditWho(a){
  var who=String((a&&a.actor)||'token');
  var declared=!!(a&&a.via);
  var via=String((a&&a.via) || (who==='token'?'token':'access'));
  if(via==='token'){
    return '<span class="who tok" title="No Cloudflare Access identity was on this request. Something holding the shared admin bearer token did it — the trail cannot say which person, and does not guess.">'
      + '<span class="nm">shared token</span></span>';
  }
  /* The full address leads the tooltip: on a timeline the name is capped and
     ellipsised, and a truncated actor nobody can read back is its own small version
     of the failure this column exists to prevent. */
  return '<span class="who acc" title="'
    + esc(who) + ' — asserted by the Cf-Access-Authenticated-User-Email header on the request'
    + (declared ? '' : ' (this entry predates the via field, so the portal is reading the rule rather than a recorded value)')
    + '. The bearer token authorised the action; the header only names who was holding it. It is NOT verified against the Access JWT, so treat it as a label, not proof.">'
    + '<span class="nm">'+esc(who)+'</span>'
    + '<span class="as'+(declared?'':' derived')+'">'+(declared?'asserted':'asserted?')+'</span></span>';
}

/* Jump into the trail already filtered to one thing — an account, a TRN, a report.
   The other two filters are CLEARED rather than kept: arriving at a list that is
   silently still narrowed by whatever was typed here twenty minutes ago is how a
   reader concludes that nothing happened. What is being searched is visible in the
   filter boxes, and the scan banner above the table says how far the search got. */
function openAudit(target){
  S.atarget=String(target||''); S.aactor=''; S.aaction=''; S.apage=1;
  go('audit'); loadAuditPage();
}

  var head='<div class="toolbar">'

    + '<span class="sp"></span><span class="mlabel">substring match &middot; case-insensitive</span></div>';

  /* The legend is not decoration. The distinction it draws is the one thing a

  var legend='<div class="panel"><div class="eyebrow">Who is in the actor column</div>'

      + '<div class="fw">No Cloudflare Access identity on the request. Something holding the <b>shared admin bearer token</b> did this. The trail cannot say which person, and does not guess.</div></div>'
    + '<div class="feat ovr"><div class="fh">'+auditWho({actor:'name@example.com',via:'access'})+'</div>'
      + '<div class="fw">Cloudflare Access stamped that address on the request header. It is a <b>label, not proof</b> — verifying it means validating the Access JWT against the team&rsquo;s public keys, which this deployment does not do. The bearer token authorised the action; the header only says who was holding it. Do not quote it as established.</div></div>'
    + '</div></div>';

  if(S.audErr){
    return head + legend + '<div class="empty"><span class="mlabel">Audit</span>'
      + '<div class="big">GET /api/audit returned <span class="mono">'+esc(S.audErr)+'</span></div>'
      + 'The trail lives in KV and is answered before the D1 gate, so this is the request failing, not the records.</div>';
  }
  if(!A){
    return head + legend + '<div class="empty"><span class="mlabel">Audit</span><div class="big">Loading the trail…</div></div>';
  }

  var rows=A.entries||A.audit||[];
  /* How much of the history this answer actually read. A filtered list that quietly
     stopped early is worse than a refusal, so the ceiling is stated either way. */
  var scan;
  if(A.scanned==null){
    scan='<div class="callout info"><span class="cl">unknown</span><span class="cb">'
      + 'This answer did not say how much of the trail it read, so nothing here can be treated as a complete history.</span></div>';
  } else if(A.truncated){
    scan='<div class="callout warn"><span class="cl">truncated</span><span class="cb">'
      + '<b>This view read the newest '+n(A.scanned)+' entries and stopped there.</b> The trail carries a descending timestamp and no index, so a filter is a scan and the scan is bounded. '
      + 'Anything older than those '+n(A.scanned)+' records was <b>not searched</b> — so a short or empty result here is not evidence that nothing else happened. '
      + 'Narrow by action or target rather than reading this list as the whole history.</span></div>';
  } else {
    scan='<div class="callout ok"><span class="cl">complete</span><span class="cb">'
      + 'Read all <b>'+n(A.scanned)+'</b> entries the trail holds — the scan did not hit its ceiling, so this <b>is</b> the whole history.'
      + (filtered?' <b>'+n(A.total)+'</b> of them match the filter.':'')+'</span></div>';
  }

  var table = rows.length
    ? '<div class="tablewrap"><table class="wide"><thead><tr>'
      + '<th style="width:118px">When</th><th style="width:158px">Action</th><th style="width:210px">Actor</th>'
      + '<th style="width:198px">Target</th><th>What changed</th>'
      + '</tr></thead><tbody>'
      + rows.map(function(a){
          return '<tr><td class="usub nowrap">'+when(a.at)+'</td>'
            + '<td><span class="pill '+auditPill(a.action||'')+'">'+esc(a.action||'—')+'</span></td>'
            + '<td>'+auditWho(a)+'</td>'
            + '<td class="mono usub" style="word-break:break-all">'
              + (a.target
                ? esc(String(a.target).slice(0,48))+' <button class="copy" data-copy="'+esc(a.target)+'">copy</button>'
                : '<span class="faint">—</span>')+'</td>'
            + '<td>'+auditDiff(a)+'</td></tr>';
        }).join('')+'</tbody></table></div>'
      + pagerN('a', A.page||S.apage, A.pages||1, A.total==null?rows.length:A.total, 'entries')
    : '<div class="empty"><span class="mlabel">Audit</span><div class="big">'
      + (filtered?'Nothing matches that filter':'No admin actions recorded yet')+'</div>'
      + (filtered
        ? 'Actor, target and action are substring matches.'+(A.truncated?' And the scan was truncated — older entries were never searched, so this is not a "no".':'')
        : 'Every lock, kill, quota change, plan or feature edit, void, RIN move, run abandon, bug decision and config edit lands here and is kept 180 days.')
      + '</div>';

  /* Why a `chars 71` with no text is not a bug in this table. */
  var what='<div class="panel"><div class="eyebrow">What is deliberately not here</div>'
    + '<p class="hint">The trail lives 180 days and is read by more people than the secret store is, so four things never reach it: <b>secrets</b> (a redactor strips any detail key whose <i>name</i> looks like one, so this stays true when a field is added in a hurry); the <b>body</b> of a support or admin note, which records its length instead and lives on the record where the next reader will see it; the <b>message</b> of a deleted bug report, because destroying the user&rsquo;s own words must not preserve them somewhere longer-lived; and admin&nbsp;&rarr;&nbsp;device text beyond a 60-character subject.</p></div>';

  return head + legend + scan + table + what;
};

function rinCheck(){

    h += j.owner ? ('Primary owner: <b>'+esc(j.owner.name||'—')+'</b> <span class="usub">'+esc(j.owner.email||'')+(j.owner.company?' · '+esc(j.owner.company):'')+'</span>')
                 : '<span class="usub">No primary owner registered.</span>';
    if(j.bound&&j.bound.length) h+='<br><span class="usub">On '+j.bound.length+' account(s): </span>'+j.bound.map(function(u){ return esc(u.name||u.email||u.deviceId)+(u.superadmin?' (super)':''); }).join(', ');

function clientVoidLegacy(rin,action){
  var run=function(){ post('/api/void',{rin:rin,action:action}).then(function(j){ if(j.ok){ toast(action==='void'?'RIN voided':'RIN un-voided','ok'); loadVoids(); loadClients(); loadAudit(); rinCheck(); } }); };
  if(action==='void') confirmDanger('Void this RIN?','Blocks '+rin+' for every account, including registration. Superadmins are exempt.','Void').then(function(v){ if(v) run(); });
  else run();
}

function demoChunks(j){
  var total=Number(j.total||0), done=Number(j.done||0), failed=Number(j.failed||0), out=[], i;
  var t0=Date.parse(j.from+'T00:00:00Z')||Date.now(), span=(86400000*30)/Math.max(1,total);
  for(i=0;i<total;i++){
    var a=new Date(t0+i*span), b=new Date(t0+(i+1)*span-1000);
    var st = i<done ? 'done'
           : i<done+failed ? 'failed'
           : (i===done+failed && /run|merg/.test(j.state)) ? 'running' : 'pending';
    var warn = st==='failed' ? 'ETA returned 500 on three consecutive attempts — chunk left for retry'
             : (st==='done' && i%9===7) ? 'page 4 came back empty on the first attempt; the retry returned rows'
             : '';
    var split = (i%11===5);
    out.push({idx:i+1, chunkId:j.jobId+'_c'+(i+1),
      from:a.toISOString().slice(0,10), to:b.toISOString().slice(0,10),
      subF: split?a.toISOString().slice(0,10):null,
      subT: split?new Date(t0+(i+0.5)*span).toISOString().slice(0,10):null,
      label:a.toISOString().slice(0,7)+(split?' · part 1':''),
      count: st==='done' ? 40+((i*37)%420) : (st==='running'? null : 0),
      warn:warn, state:st});
  }
  return out;
}
